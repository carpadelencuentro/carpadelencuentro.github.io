  .cel { background:linear-gradient(160deg,#1F3FA8,#0B1638); border-radius:24px; padding:12px 10px 22px; }

  .aviso { position:fixed; left:16px; right:16px; bottom:86px; max-width:620px; margin:0 auto; background:#FFF4CF; color:#5C4400; border:1px solid #F0D98A; border-radius:14px; padding:12px 14px; font-weight:700; z-index:700; }

<header>

<main>
  <section id="login" class="card suave">

    <label for="pass">Contraseña de administrador</label>
    <input id="pass" type="password" autocomplete="current-password" maxlength="200">
    <label class="check-fila" style="font-weight:600"><input id="recordarme" class="check" type="checkbox" checked> Mantener la sesión abierta en esta compu (no lo marques en una compu prestada)</label>
    <div class="acciones"><button class="btn" id="entrar" type="button">Entrar</button></div>

      <h3 id="primeraTitulo"></h3>

      <div id="pasosToken"></div>
      <label for="token">Clave de GitHub</label>
      <input id="token" type="password" autocomplete="off" maxlength="255" placeholder="github_pat_...">
      <div id="cajaPass2"><label for="pass2">Repetí la contraseña</label><input id="pass2" type="password" autocomplete="new-password" maxlength="200"></div>
      <div class="acciones">

<div class="barra oculto" id="barra">

<div id="modal">
  <div class="caja">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <b style="font-size:17px">Arrastrá el punto hasta la puerta de la iglesia</b>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const $ = (s) => document.querySelector(s);
const ARCHIVO = 'contenido.json';
const DUENO = 'carpadelencuentro';
const REPO = 'carpadelencuentro.github.io';
// Base en línea (Supabase): con ella lo que se guarda se ve al instante en la app y funcionan los pedidos y las campañas de oración.
// La dirección (https://<proyecto>.supabase.co) y la anon key son públicas: van también dentro de la app.
// Mientras estén vacías, todo sigue funcionando como antes (solo GitHub).
const SUPABASE_URL = 'https://iqmfcreqirwhlxgldvig.supabase.co';
const SUPABASE_ANON = 'sb_publishable_m5-9aa0bdvwbgHpI4znfTw_a4cO85hE';
const SUPA_EMAIL = 'panel@carpadelencuentro.github.io';
let datos = null, sha = null, sucio = false, tab = 'novedades';
// Claves descifradas (GitHub y Firebase): viven solo en esta variable, nunca en el navegador.
let secretos = null, formatoViejo = false, pendiente = null;

function el(tag, attrs = {}, ...hijos) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'on') for (const [ev, fn] of Object.entries(v)) e.addEventListener(ev, fn);
    else if (k === 'text') e.textContent = v;
    else if (k === 'value') e.value = v ?? '';
    else e.setAttribute(k, v);
  }
  for (const h of hijos.flat()) if (h != null) e.append(h);
  return e;
}

let version = 0;
function cambio() { sucio = true; version++; $('#guardar').disabled = false; $('#estado').textContent = 'Hay cambios sin guardar'; $('#estado').className = 'estado'; if (tab === 'inicio') pintarPreviaInicio(); }

const esHttps = (u) => { try { const x = new URL(String(u)); return x.protocol === 'https:' && !!x.hostname; } catch (e) { return false; } };
const MAX_LINEA = 200, MAX_TEXTO = 3000;
const nuevoId = () => 'c' + Math.random().toString(36).slice(2);

function campo(etiqueta, obj, clave, opts = {}) {
  const id = nuevoId();
  const input = opts.multilinea ? el('textarea', { id, value: obj[clave] ?? '' }) : el('input', { id, value: obj[clave] ?? '', type: opts.tipo || 'text' });
  if (opts.placeholder) input.placeholder = opts.placeholder;
  if (opts.multilinea || !opts.tipo || opts.tipo === 'text') input.maxLength = opts.max || (opts.multilinea ? MAX_TEXTO : MAX_LINEA);
  const aviso = el('p', { class: 'ayuda error oculto', style: 'margin:6px 0 0' });
  const revisarLink = () => {
    const u = input.value.trim(), malo = !!(opts.https && u && !esHttps(u));
    aviso.textContent = malo ? 'Tiene que ser un link que empiece con https://' : '';
    aviso.classList.toggle('oculto', !malo);
  };
  input.addEventListener('input', () => { obj[clave] = opts.numero ? parseFloat(input.value) : input.value; revisarLink(); if (opts.alCambiar) opts.alCambiar(); cambio(); });
  revisarLink();
  return el('div', {}, el('label', { for: id, text: etiqueta }), input, aviso, opts.ayuda ? el('p', { class: 'ayuda', text: opts.ayuda, style: 'margin:6px 0 0' }) : null);
}

// Inglés: la app se ve en inglés en los celulares que no están en español.
// Cada texto se traduce solo y se puede corregir a mano; se guarda en datos.en.
// Palabras de la app que el traductor automático traduce mal o en minúscula ("preachings"): van fijas, como en la app.
const TRADUCCIONES_FIJAS = {
  'Inicio': 'Home', 'Eventos': 'Events', 'Encuentros': 'Events', 'Prédicas': 'Sermons', 'Oración': 'Prayer', 'Biblia': 'Bible',
  'Iglesias cerca': 'Churches nearby', 'Ofrendar': 'Give', 'Novedades': 'News',
  'Podemos orar por vos': 'We can pray for you', 'Encontrá dónde congregarte': 'Find a place to worship',
  'Ayudá a llevar la carpa': 'Help take the tent further', 'Escuchá o mirá cada noche': 'Listen to or watch every night',
  'Escuchá las charlas más destacadas': 'Listen to the most watched talks',
};
// Nombres que no se traducen (el traductor pasaba "Carpa Salto" a "Jump Tent"). Los largos primero.
const NOMBRES_PROPIOS = ['Carpa del Encuentro', 'Villa del Carmen', 'Ciudad del Carmen', 'El Carmen', 'Juan Lacaze', 'San Carlos', 'Tacuarembó', 'Maldonado', 'Paysandú', 'Montevideo', 'Colonia', 'Durazno', 'Carmelo', 'Rosario', 'Rocha', 'Salto', 'Chuy', 'Carpa'];
// "la carpa" no es el pez ("carp"): siempre "tent".
const PALABRAS_FIJAS = [['carpas', 'tents'], ['carpa', 'tent']];
const conNombre = (t) => NOMBRES_PROPIOS.some((n) => new RegExp(`(?<!\\p{L})${n}(?!\\p{L})`, 'u').test(t));
// Si el español empieza con mayúscula, el inglés también.
const comoElOriginal = (es, en) => (/^\p{Lu}/u.test(es) && /^\p{Ll}/u.test(en) ? en.charAt(0).toUpperCase() + en.slice(1) : en);
async function traducir(t) {
  const fija = TRADUCCIONES_FIJAS[String(t).trim()];
  if (fija) return fija;
  // Los nombres propios viajan como marcas que el traductor no toca, y después se vuelven a poner.
  const nombres = [];
  const marcar = (x, es, en) => x.replace(new RegExp(`(?<!\\p{L})${es}(?!\\p{L})`, 'gu'), () => { nombres.push(en); return ` QX${nombres.length - 1}QX `; });
  const marcado = PALABRAS_FIJAS.reduce((x, [es, en]) => marcar(x, es, en), NOMBRES_PROPIOS.reduce((x, n) => marcar(x, n, n), String(t)));
  const r = await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=es&tl=en&dt=t&q=' + encodeURIComponent(marcado));
  if (!r.ok) throw new Error('traductor');
  const en = (await r.json())[0].map((p) => p[0]).join('').replace(/\s?QX\s?(\d+)\s?QX\s?/gi, (m, i) => (m.startsWith(' ') ? ' ' : '') + (nombres[+i] ?? '') + (m.endsWith(' ') ? ' ' : ''));
  return comoElOriginal(t, en.replace(/\s{2,}/g, ' ').trim());
}

// Una sola vez: corrige las traducciones automáticas que ya estaban guardadas (palabras de la app mal o en
// minúscula y nombres de lugares traducidos). Queda como cambio sin guardar para que lo confirmes.
async function repararTraducciones() {
  if (!datos || datos.config.traducciones_v2) return;
  let cambiadas = 0;
  for (const [es, en] of Object.entries(datos.en || {})) {
    let nuevo = TRADUCCIONES_FIJAS[es] || null;
    if (!nuevo && conNombre(es)) { try { nuevo = await traducir(es); } catch (e) {} }
    if (!nuevo) nuevo = comoElOriginal(es, en);
    if (!datos) return;
    if (nuevo && nuevo !== en) { datos.en[es] = nuevo; cambiadas++; }
  }
  datos.config.traducciones_v2 = true;
  if (!cambiadas) return;
  cambio(); pintar();
  $('#estado').textContent = `Corregimos ${cambiadas} ${cambiadas === 1 ? 'traducción' : 'traducciones'} al inglés: tocá "Guardar cambios" para que se vean en la app.`;
}

function textosATraducir() {
  const xs = [];
  const add = (t) => { if (t && String(t).trim()) xs.push(String(t)); };
  datos.noticias.forEach((n) => { add(n.titulo); add(n.texto); });
  (Array.isArray(datos.inicio) ? datos.inicio : []).forEach((s) => { add(s.titulo); add(s.sub); add(s.pill); });
  ['proximo_titulo', 'proximo_fecha', 'proximo_lugar'].forEach((k) => add(datos.config[k]));
  datos.iglesias.forEach((c) => { add(c.nombre); add(c.reuniones); });
  return [...new Set(xs)];
}

async function completarIngles() {
  datos.en = datos.en || {};
  const usados = textosATraducir();
  for (const t of usados) if (!datos.en[t]) { try { datos.en[t] = await traducir(t); } catch (e) {} }
  const limpio = {};
  usados.forEach((t) => { if (datos.en[t]) limpio[t] = datos.en[t]; });
  datos.en = limpio;
}

// Campo en español + su vista previa en inglés debajo.
function campoEn(etiqueta, obj, clave, opts = {}) {
  datos.en = datos.en || {};
  const lineas = () => String(obj[clave] ?? '').split('\n').map((x) => x.trim()).filter(Boolean);
  const valorEn = () => opts.lineas ? lineas().map((l) => datos.en[l] || '').join('\n') : (datos.en[obj[clave]] || '');
  const id = 'e' + Math.random().toString(36).slice(2);
  const en = opts.multilinea ? el('textarea', { id, class: 'en' }) : el('input', { id, class: 'en' });
  en.maxLength = opts.multilinea ? MAX_TEXTO : MAX_LINEA * 2;
  en.value = valorEn();
  en.placeholder = 'Se traduce solo cuando escribís en español';
  en.addEventListener('input', () => {
    if (opts.lineas) { const es = lineas(), xs = en.value.split('\n'); es.forEach((l, i) => { if (xs[i] != null) datos.en[l] = xs[i].trim(); }); }
    else if (obj[clave]) datos.en[obj[clave]] = en.value;
    cambio();
  });
  let timer = null;
  const programar = () => {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      const faltan = (opts.lineas ? lineas() : [String(obj[clave] ?? '')]).filter((t) => t.trim() && !datos.en[t]);
      if (faltan.length) en.placeholder = 'Traduciendo...';
      try { for (const t of faltan) datos.en[t] = await traducir(t); } catch (e) { en.placeholder = 'No se pudo traducir: escribilo a mano'; }
      en.value = valorEn();
    }, 700);
  };
  const caja = campo(etiqueta, obj, clave, { ...opts, alCambiar: () => { if (opts.alCambiar) opts.alCambiar(); programar(); } });
  caja.append(el('label', { for: id, class: 'en-label', text: 'En inglés (vista previa, la podés corregir)' }), en);
  return caja;
}

// Ventana para agregar: lo nuevo se suma a la lista recién al tocar "Agregar".
// Si alAgregar devuelve una promesa (por ejemplo, porque guarda en la base en línea), la ventana espera
// con los botones apagados y se cierra solo si salió bien; si no, muestra el problema y queda abierta.
function abrirDialogo(titulo, campos, alAgregar) {
  const fondo = $('#dialogo'), caja = $('#dialogo .caja');
  const error = el('p', { class: 'ayuda error', 'aria-live': 'polite' });
  const inputs = {};
  let ocupado = false;
  const filas = campos.map((c) => {
    const id = 'd' + Math.random().toString(36).slice(2);
    let input;
    if (c.opciones) input = el('select', { id }, ...c.opciones.map(([v, t]) => el('option', { value: v, text: t })));
    else if (c.multilinea) input = el('textarea', { id });
    else input = el('input', { id, type: c.tipo || 'text' });
    if (c.valor != null) input.value = c.valor;
    if (c.placeholder) input.placeholder = c.placeholder;
    if (c.max) input.maxLength = c.max;
    if (c.mayusculas) {
      input.setAttribute('autocapitalize', 'characters'); input.setAttribute('autocomplete', 'off'); input.spellcheck = false;
      input.addEventListener('input', () => {
        const a = input.selectionStart, b = input.selectionEnd;
        input.value = input.value.toUpperCase();
        try { input.setSelectionRange(a, b); } catch (e) {}
      });
    }
    inputs[c.clave] = input;
    return { c, fila: el('div', { style: 'margin-bottom:12px' }, el('label', { for: id, text: c.etiqueta }), input, c.ayuda ? el('p', { class: 'ayuda', text: c.ayuda, style: 'margin:6px 0 0' }) : null) };
  });
  const mostrarSegun = () => filas.forEach(({ c, fila }) => { if (c.visibleSi) fila.classList.toggle('oculto', !c.visibleSi(inputs)); });
  Object.values(inputs).forEach((i) => i.addEventListener('change', mostrarSegun));
  const cerrar = () => { fondo.classList.add('oculto'); caja.replaceChildren(); document.removeEventListener('keydown', esc); };
  const esc = (e) => { if (e.key === 'Escape' && !ocupado) cerrar(); };
  const botonAgregar = el('button', { class: 'btn', type: 'button', text: 'Agregar' });
  const botonCancelar = el('button', { class: 'btn sec', type: 'button', text: 'Cancelar', on: { click: () => { if (!ocupado) cerrar(); } } });
  const agregar = () => {
    if (ocupado) return;
    const v = {};
    for (const [k, i] of Object.entries(inputs)) v[k] = i.value.trim();
    const res = alAgregar(v);
    if (!res || typeof res.then !== 'function') {
      if (res) { error.textContent = res; return; }
      cerrar();
      return;
    }
    ocupado = true; botonAgregar.disabled = botonCancelar.disabled = true;
    error.className = 'ayuda'; error.textContent = 'Un momento...';
    res.then((problema) => problema, (e) => (e && e.message) || 'No se pudo. Probá de nuevo.').then((problema) => {
      ocupado = false; botonAgregar.disabled = botonCancelar.disabled = false;
      error.className = 'ayuda error';
      if (problema) { error.textContent = problema; return; }
      cerrar();
    });
  };
  botonAgregar.addEventListener('click', agregar);
  caja.replaceChildren(
    el('h2', { text: titulo, style: 'margin-top:0' }),
    ...filas.map((f) => f.fila), error,
    el('div', { class: 'acciones' }, botonAgregar, botonCancelar));
  mostrarSegun();
  fondo.classList.remove('oculto');
  document.addEventListener('keydown', esc);
  const primero = caja.querySelector('input, textarea, select');
  if (primero) primero.focus();
}

async function traducirNuevos(textos) {
  for (const t of textos) if (t && !datos.en[t]) { try { datos.en[t] = await traducir(t); } catch (e) {} }
  if (!$('#dialogo').classList.contains('oculto')) return;
  pintar();
}

    const c = { id: `${slug}-${Date.now().toString(36)}`, ciudad: v.ciudad, nombre: v.nombre, direccion: v.direccion, telefonos: telefonos(v.tels), reuniones: v.reuniones, fotos: [], lat: -34.88, lng: -56.17, aprox: true };

function telefonos(texto) {
  return texto.split(/[,;/]|\s-\s/).map((p) => p.replace(/\D/g, '')).filter(Boolean).map((d) => {
    if (d.length === 9 && d.startsWith('09')) return { num: `${d.slice(0, 3)} ${d.slice(3, 6)} ${d.slice(6)}`, wa: '598' + d.slice(1), tel: '+598' + d.slice(1) };
    if (d.length === 8 && /^[24]/.test(d)) return { num: `${d.slice(0, 4)} ${d.slice(4)}`, wa: null, tel: '+598' + d };
    return { num: d, wa: null, tel: '+' + d };
  });
}

function idVideo(t) {
  const m = String(t || '').match(/(?:v=|youtu\.be\/|shorts\/|live\/)([\w-]{11})/) || String(t || '').trim().match(/^([\w-]{11})$/);
  return m ? m[1] : '';
}

// Fotos: un link https se muestra tal cual; un nombre suelto es una foto que ya viene dentro de la app.
const vistasPrevias = new Map();
const NOMBRE_FOTO_APP = /^[\w-][\w.-]*$/; // nombre de archivo suelto, sin carpetas ni ".."
function srcFoto(f, carpeta) {
  if (vistasPrevias.has(f)) return vistasPrevias.get(f);
  if (esHttps(f)) return f;
  if (f && NOMBRE_FOTO_APP.test(f)) return `../fotos/${carpeta}/${encodeURIComponent(f)}`;
  return '../logo.jpg';
}
function imgFoto(f, carpeta, clase) {
  const i = el('img', { alt: '' });

  i.addEventListener('error', () => { if (!i.src.endsWith('/logo.jpg')) i.src = '../logo.jpg'; });
  i.src = srcFoto(f, carpeta);
  return i;
}

function tarjetaSeccion(s, i) {
  const xs = datos.inicio;
  const img = el('img', { alt: '', class: 'mini-seccion' });

  const opcionSubida = el('option', { value: SUBIDA, text: 'Foto subida' });

  const mover = (d) => { const j = i + d; if (j < 0 || j >= xs.length) return; [xs[i], xs[j]] = [xs[j], xs[i]]; cambio(); pintar(); };

const TIPOS_FOTO = ['image/png', 'image/jpeg', 'image/webp'];
const sanitizarNombre = (t) => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'foto';
const nombreBase = (id, alternativo) => sanitizarNombre(/^nuev[ao]-\d+$/.test(id || '') && alternativo ? alternativo : (id || alternativo));

function selectorFoto(base, alListo) {

  } } });

async function achicarFoto(archivo) {
  let img;
  try { img = await createImageBitmap(archivo, { imageOrientation: 'from-image' }); }
  catch (e) {
    img = await new Promise((ok, mal) => {
      const i = new Image(), u = URL.createObjectURL(archivo);
      i.onload = () => { URL.revokeObjectURL(u); ok(i); };
      i.onerror = () => { URL.revokeObjectURL(u); mal(new Error('No pude abrir esa imagen. Probá con otra.')); };
      i.src = u;
    });
  }
  const w0 = img.naturalWidth || img.width, h0 = img.naturalHeight || img.height;
  if (!w0 || !h0) throw new Error('No pude abrir esa imagen. Probá con otra.');
  const k = Math.min(1, 1280 / Math.max(w0, h0));
  const w = Math.max(1, Math.round(w0 * k)), h = Math.max(1, Math.round(h0 * k));
  const lienzo = document.createElement('canvas');
  lienzo.width = w; lienzo.height = h;
  const g = lienzo.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
  g.imageSmoothingQuality = 'high';
  g.drawImage(img, 0, 0, w, h);
  if (img.close) img.close();
  return new Promise((ok, mal) => lienzo.toBlob((b) => (b ? ok(b) : mal(new Error('No pude convertir la foto.'))), 'image/jpeg', 0.85));
}

const blobABase64 = (b) => new Promise((ok, mal) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = () => mal(new Error('No pude leer la foto.')); r.readAsDataURL(b); });

async function nombreLibre(base) {
  const r = await api('contents/fotos');
  const lista = r.ok ? await r.json() : [];
  const usados = new Set(Array.isArray(lista) ? lista.map((f) => f.name) : []);
  let n = 1;
  while (usados.has(`${base}-${n}.jpg`)) n++;
  return `${base}-${n}.jpg`;
}

async function subirFoto(archivo, base, decir) {
  if (!TIPOS_FOTO.includes(archivo.type)) throw new Error('Elegí una foto JPG, PNG o WEBP.');
  if (archivo.size > 15 * 1024 * 1024) throw new Error('La foto pesa más de 15 MB. Elegí una más liviana.');
  decir('Preparando la foto...');
  const jpg = await achicarFoto(archivo);
  const previa = URL.createObjectURL(jpg);
  const contenido = await blobABase64(jpg);
  decir('Subiendo...');
  let nombre = await nombreLibre(base);
  for (let intento = 0; intento < 3; intento++) {
    const r = await api('contents/fotos/' + nombre, { method: 'PUT', body: JSON.stringify({ message: 'Panel: foto ' + nombre, content: contenido }) });
    if (r.ok) {
      const url = `https://raw.githubusercontent.com/${DUENO}/${REPO}/main/fotos/${nombre}`;
      vistasPrevias.set(url, previa);
      return url;
    }
    if (r.status !== 422) throw new Error('No se pudo subir la foto (' + r.status + ').');
    nombre = nombre.replace(/-(\d+)\.jpg$/, (_, n) => `-${+n + 1}.jpg`);
  }
  throw new Error('No se pudo subir la foto. Probá de nuevo.');
}

const avisosVacio = () => ({ lista: null, error: '', cuando: 0, cargando: false, msg: null });
let avisosDb = avisosVacio(), cajaAvisos = null;
const nota = (ok, texto) => ({ ok, texto, hasta: Date.now() + 15000 });
const notaVigente = (m) => !!(m && m.hasta > Date.now());

async function cargarAvisos() {
  if (!supa || avisosDb.cargando) return;
  avisosDb.cargando = true;
  pintarListaAvisos();
  try {
    avisosDb.migracion = migracion ? (await migracion) || '' : '';
    const r = await db('avisos?select=id,fecha,titulo,texto,titulo_en,texto_en,accion,link&order=fecha.desc&limit=30');
    if (!r.ok) throw await errorDb(r);
    const xs = await r.json();
    avisosDb.lista = (Array.isArray(xs) ? xs : []).filter((h) => h && typeof h === 'object' && h.id != null).map((h) => ({
      id: String(h.id), fecha: String(h.fecha || ''), titulo: String(h.titulo || ''), texto: String(h.texto || ''),
      titulo_en: String(h.titulo_en || ''), texto_en: String(h.texto_en || ''), accion: String(h.accion || 'inicio'), link: String(h.link || ''),
    }));
    avisosDb.error = '';
  } catch (e) { avisosDb.lista = null; avisosDb.error = e.message; }
  finally { avisosDb.cuando = Date.now(); avisosDb.cargando = false; pintarListaAvisos(); }
}

function tarjetaAviso(h) {
  const boton = el('button', { class: 'btn peligro chico', type: 'button', text: 'Quitar de Avisos' });
  boton.addEventListener('click', () => quitarAviso(h, boton));
  return el('div', { class: 'card' },
    el('span', { style: 'font-size:13px;font-weight:600;color:var(--gris)' }, fechaLinda(h.fecha) + ' · Abre: ' + nombreAccion(h.accion)),
    el('b', { style: 'display:block;margin-top:4px;overflow-wrap:anywhere', text: h.titulo || '' }),
    el('p', { style: 'margin:4px 0 0;white-space:pre-line;overflow-wrap:anywhere', text: h.texto || '' }),
    h.titulo_en || h.texto_en ? el('p', { class: 'ayuda', style: 'margin:6px 0 0;overflow-wrap:anywhere', text: 'Inglés: ' + (h.titulo_en || '') + ' — ' + (h.texto_en || '') }) : null,
    h.accion === 'link' && h.link ? el('p', { class: 'ayuda', style: 'margin:4px 0 0;overflow-wrap:anywhere', text: h.link }) : null,

function pintarListaAvisos() {
  if (!cajaAvisos || !cajaAvisos.isConnected || !datos) return;
  const hijos = [];
  if (notaVigente(avisosDb.msg)) hijos.push(el('p', { class: 'ayuda ' + (avisosDb.msg.ok ? 'ok' : 'error'), 'aria-live': 'polite', text: avisosDb.msg.texto }));
  if (supa && avisosDb.migracion) hijos.push(el('p', { class: 'ayuda error', text: avisosDb.migracion }));
  let lista = datos.push_historial;
  if (supa && avisosDb.lista) lista = avisosDb.lista;
  else if (supa && !avisosDb.error) { cajaAvisos.replaceChildren(...hijos, el('p', { class: 'ayuda', text: 'Cargando avisos...' })); return; }
  else if (supa) hijos.push(el('p', { class: 'ayuda error', text: 'No pude leer los avisos de la base en línea: ' + avisosDb.error + ' Abajo está la copia guardada en GitHub.' }));
  else if (hayDb()) hijos.push(el('p', { class: 'ayuda', text: 'Esta es la copia guardada en GitHub. Para quitar avisos de la app al instante, primero tiene que estar conectada la base en línea (mirá el aviso de arriba).' }));
  hijos.push(...(lista.length ? lista.map((h) => tarjetaAviso(h)) : [el('p', { class: 'ayuda', text: 'Todavía no se mandó ningún aviso.' })]));
  cajaAvisos.replaceChildren(...hijos);
}

// "Quitar de Avisos": lo borra de la base (desaparece al instante de todos los celulares) y de la copia en GitHub.
// Con la base conectada se borra de ella siempre, aunque la lista de arriba sea la copia de GitHub (si no se pudo leer la base).
async function quitarAviso(h, boton) {
  const alInstante = !!supa;
  const extra = sucio ? '\n\nOjo: también se van a guardar los cambios pendientes de las otras pestañas.' : '';
  const pregunta = alInstante
    ? '¿Quitar este aviso de Avisos de la app? Se saca al instante de todos los celulares. (La notificación que ya les llegó no se puede deshacer.)'
    : '¿Quitar este aviso de la lista de Avisos de la app? (A los celulares ya les llegó: eso no se puede deshacer.)';
  if (!confirm(pregunta + extra)) return;
  boton.disabled = true;
  if (alInstante) {
    try { await dbBorrar('avisos', h.id); }
    catch (e) { avisosDb.msg = nota(false, 'No se quitó: ' + e.message); boton.disabled = false; pintarListaAvisos(); return; }
    if (avisosDb.lista) avisosDb.lista = avisosDb.lista.filter((x) => x.id !== h.id);
  }
  if (!datos) return;
  const i = datos.push_historial.findIndex((x) => x.id === h.id);
  let guardado = true;
  if (i >= 0) { datos.push_historial.splice(i, 1); cambio(); guardado = await guardar(); }
  if (alInstante) avisosDb.msg = nota(guardado, guardado ? 'Quitado: ya no aparece en Avisos de la app.' : 'Quitado de la app, pero no se pudo actualizar la copia en GitHub: tocá "Guardar cambios".');
  else if (!guardado) avisosDb.msg = nota(false, 'No se pudo guardar: tocá "Guardar cambios".');
  else avisosDb.msg = nota(true, hayDb() ? 'Quitado de la copia en GitHub. Para que se saque de la app, primero tiene que estar conectada la base en línea.' : 'Quitado. En unos minutos deja de aparecer en Avisos de la app.');
  if (tab === 'push') pintar();
}

async function enviarPush(boton, estado) {
  const p = { titulo: push.titulo.trim(), texto: push.texto.trim(), titulo_en: push.titulo_en.trim(), texto_en: push.texto_en.trim(), accion: push.accion, link: push.accion === 'link' ? push.link.trim() : '' };
  const error = (t) => { estado.textContent = t; estado.className = 'ayuda error'; };
  if (!p.titulo || !p.texto) return error('Escribí el título y el mensaje.');
  if (!p.titulo_en || !p.texto_en) return error('Falta el texto en inglés. Esperá a que se traduzca o escribilo a mano.');
  if (p.titulo.length > MAX_TITULO_PUSH || p.titulo_en.length > MAX_TITULO_PUSH) return error(`El título puede tener hasta ${MAX_TITULO_PUSH} letras (fijate también el de inglés).`);
  if (p.texto.length > MAX_TEXTO_PUSH || p.texto_en.length > MAX_TEXTO_PUSH) return error(`El mensaje puede tener hasta ${MAX_TEXTO_PUSH} letras (fijate también el de inglés).`);
  if (!ACCIONES_PUSH.some(([a]) => a === p.accion)) return error('Elegí qué abre la notificación.');
  if (p.accion === 'link' && !esHttps(p.link)) return error('El link tiene que empezar con https://');
  if (!secretos || !secretos.firebase) return error('Falta conectar Firebase en la pestaña Seguridad.');
  const extra = sucio ? '\n\nOjo: también se van a guardar los cambios pendientes de las otras pestañas.' : '';
  if (!confirm(`¿Enviar este aviso a todos los celulares que tienen la app?\n\n${p.titulo}\n${p.texto}\n\nNo se puede deshacer.${extra}`)) return;
  boton.disabled = true;
  estado.className = 'ayuda'; estado.textContent = 'Conectando con Firebase...';
  const azar = crypto.getRandomValues(new Uint8Array(6));
  const id = Date.now().toString(36) + '-' + Array.from(azar, (b) => b.toString(16).padStart(2, '0')).join('');
  const data = { accion: p.accion, link: p.link, id };
  const enviados = [], fallas = [];
  try {
    const acceso = await pedirAcceso(secretos.firebase);
    estado.textContent = 'Enviando...';
    for (const [topic, idioma, titulo, texto] of [['todos_es', 'español', p.titulo, p.texto], ['todos_en', 'inglés', p.titulo_en, p.texto_en]]) {
      try { await mandarPush(acceso, secretos.firebase.project_id, topic, titulo, texto, data); enviados.push(idioma); }
      catch (e) { fallas.push(idioma + ': ' + e.message); }
    }
  } catch (e) { fallas.push(e.message); }
  if (!enviados.length) { boton.disabled = false; return error('No se envió. ' + fallas.join(' · ')); }
  const aviso = { id, fecha: new Date().toISOString(), ...p };
  // Con la base en línea, el aviso aparece al instante en Avisos de la app (mismo id que el push).
  let enLinea = false, motivoDb = '';
  if (supa) {
    estado.textContent = 'Poniéndolo en Avisos de la app...';
    try { await insertarAvisos([aviso]); enLinea = true; } catch (e) { motivoDb = e.message; }
  }
  if (!datos) return;
  datos.push_historial.unshift(aviso);
  datos.push_historial = datos.push_historial.slice(0, 30);
  cambio();
  estado.textContent = 'Guardando en Avisos...';
  const guardado = await guardar();
  let texto = fallas.length ? `Se envió solo a los celulares en ${enviados.join(' y ')}. Falló: ${fallas.join(' · ')}. Si lo mandás de nuevo, a los celulares en ${enviados.join(' y ')} les llega dos veces.` : 'Enviado a todos los celulares (en español y en inglés).';
  if (enLinea) texto += ' Ya aparece en Avisos de la app.' + (guardado ? '' : ' (No se pudo guardar la copia en GitHub: tocá "Guardar cambios".)');
  else if (hayDb()) texto += ' Pero no quedó en Avisos de la app: ' + (motivoDb || 'falta conectar la base en línea (mirá el aviso de arriba).') + (guardado ? ' Quedó guardado en la copia de GitHub.' : '');
  else texto += guardado ? ' En unos minutos aparece también en Avisos de la app.' : ' Pero no se pudo guardar en Avisos: tocá "Guardar cambios".';
  if (!fallas.length) { push = pushVacio(); pushManual = { titulo: false, texto: false }; }
  pushResultado = { ok: !fallas.length && guardado && (enLinea || !hayDb()), texto };
  avisosDb.cuando = 0;
  if (tab === 'push') pintar();
}

async function mandarPush(acceso, proyecto, topic, titulo, texto, data) {
  const r = await fetch(`https://fcm.googleapis.com/v1/projects/${encodeURIComponent(proyecto)}/messages:send`, {
    method: 'POST',
    cache: 'no-store',
    headers: { Authorization: 'Bearer ' + acceso, 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: { topic, notification: { title: titulo, body: texto }, data, android: { priority: 'HIGH', notification: { channel_id: 'avisos' } }, apns: { payload: { aps: { sound: 'default' } } } } }),
  });
  if (r.ok) return;
  const j = await r.json().catch(() => ({}));
  const motivo = (j.error && j.error.message) || 'error ' + r.status;
  if (r.status === 403) throw new Error('Google no dejó enviar (' + motivo + '). Revisá que la API "Firebase Cloud Messaging API" esté activada en el proyecto.');
  throw new Error(motivo);
}

// Firma un JWT con la cuenta de servicio y lo canjea por un permiso de 1 hora para mandar push.
async function pedirAcceso(cuenta) {
  if (accesoFcm && accesoFcm.email === cuenta.client_email && accesoFcm.vence > Date.now() + 120000) return accesoFcm.valor;
  const ahora = Math.floor(Date.now() / 1000);
  const parte = (o) => b64url(new TextEncoder().encode(JSON.stringify(o)));
  const sinFirmar = parte({ alg: 'RS256', typ: 'JWT' }) + '.' + parte({ iss: cuenta.client_email, scope: 'https://www.googleapis.com/auth/firebase.messaging', aud: 'https://oauth2.googleapis.com/token', iat: ahora, exp: ahora + 3600 });
  let privada;
  try { privada = await crypto.subtle.importKey('pkcs8', pemABytes(cuenta.private_key), { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' }, false, ['sign']); }
  catch (e) { throw new Error('No se pudo leer la clave privada de Firebase. Generá una nueva en Firebase y conectala otra vez.'); }
  const firma = new Uint8Array(await crypto.subtle.sign('RSASSA-PKCS1-v1_5', privada, new TextEncoder().encode(sinFirmar)));
  const r = await fetch('https://oauth2.googleapis.com/token', {
    method: 'POST',
    cache: 'no-store',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer', assertion: sinFirmar + '.' + b64url(firma) }),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.access_token) {
    const motivo = j.error_description || j.error || r.status;
    throw new Error('Google no aceptó la cuenta de Firebase (' + motivo + ').' + (j.error === 'invalid_grant' ? ' Revisá que la fecha y hora de la compu estén bien, o que la clave no se haya borrado en Firebase.' : ''));
  }
  accesoFcm = { valor: j.access_token, vence: Date.now() + (j.expires_in || 3600) * 1000, email: cuenta.client_email };
  return j.access_token;
}

async function leerCuentaServicio(archivo) {
  if (!archivo) throw new Error('Elegí el archivo .json que bajaste de Firebase.');
  if (archivo.size > 20000) throw new Error('Ese archivo es muy grande para ser la clave de Firebase.');
  let j;
  try { j = JSON.parse(await archivo.text()); } catch (e) { throw new Error('Ese archivo no es un .json válido.'); }
  if (!j || j.type !== 'service_account') throw new Error('Ese archivo no es una cuenta de servicio de Firebase.');
  if (typeof j.project_id !== 'string' || !/^[a-z0-9-]{4,40}$/.test(j.project_id)) throw new Error('Al archivo le falta project_id.');
  if (typeof j.client_email !== 'string' || !/^[^@\s]+@[^@\s]+\.iam\.gserviceaccount\.com$/.test(j.client_email)) throw new Error('Al archivo le falta client_email.');
  if (typeof j.private_key !== 'string' || !j.private_key.includes('BEGIN PRIVATE KEY')) throw new Error('Al archivo le falta private_key.');
  return j;
}

function validarToken(t) {
  if (!t) throw new Error('Pegá la clave de GitHub.');

async function probarToken(token) {
  const r = await api(`contents/${ARCHIVO}`, {}, token);
  if (r.status === 401) throw new Error('GitHub no reconoce esa clave. Copiala de nuevo.');

// Vuelve a leer clave.json, confirma la contraseña actual y guarda las claves nuevas cifradas (formato v2).
async function guardarSecretos(nuevos, passActual, passNueva) {
  if (espera()) throw new Error('Por seguridad, esperá ' + mmss(espera()) + ' para volver a probar.');
  if (!passActual) throw new Error('Escribí la contraseña actual.');
  const actual = await leerClaveCifrada();
  if (!actual) throw new Error('No encontré la configuración guardada.');
  try { await abrirSecretos(actual, passActual); } catch (e) { anotarFallo(); throw new Error('La contraseña actual no es correcta.'); }
  limpiarFallos();
  await escribirClave(nuevos, passNueva || passActual, actual.sha);
  secretos = nuevos; formatoViejo = false; accesoFcm = null;
  guardarRecordado();
  passCorta = (passNueva || passActual).length < 10;
}

  if (f) botones.push(accion('Desconectar Firebase', 'btn peligro', estF, async () => {

  }));
  partes.push(el('div', { class: 'card' },

    el('ol', { class: 'ayuda' },

      el('li', {}, 'Tocá el engranaje → ', el('b', { text: 'Configuración del proyecto → Cuentas de servicio → Generar nueva clave privada' }), '. Se baja un archivo .json.'),
      el('li', {}, 'Elegí ese archivo acá abajo, escribí la contraseña y tocá ', el('b', { text: f ? 'Reemplazar Firebase' : 'Conectar Firebase' }), '. Después borrá el archivo de la compu.')),
    el('div', { class: 'fila' }, caja('Archivo .json de Firebase', archivo), caja('Contraseña actual', fA)),
    el('div', { class: 'acciones' }, ...botones),
    estF));

  partes.push(el('div', { class: 'card' },
    el('h3', { text: 'Base en línea (Supabase)' }),

}

let mapa = null, marca = null, alListo = null;
function abrirMapa(c, listo) {

  if (!mapa) {

function api(ruta, opciones = {}, token = secretos && secretos.github) {
  return fetch(`https://api.github.com/repos/${DUENO}/${REPO}/${ruta}`, {
    ...opciones,
    cache: 'no-store',
    headers: { ...(token ? { Authorization: `Bearer ${token}` } : {}), Accept: 'application/vnd.github+json', ...(opciones.headers || {}) },
  });
}

// ---------- Base en línea (Supabase) ----------
// Cliente mínimo con fetch (sin librerías): login del usuario del panel, consultas REST y renovación de la sesión.
// La sesión (access_token y refresh_token) vive solo en la variable "supa": nunca en el navegador, la URL ni la consola.
const SUPA = SUPABASE_URL.trim().replace(/\/+$/, '');
const ANON = SUPABASE_ANON.trim();
const hayDb = () => !!(SUPA && ANON);
let supa = null, supaProblema = '', sesionDb = 0, renovando = null, dbConContenido = true, dbPendiente = false, migracion = null;

// La anon key vieja es un JWT y va también como Authorization; la nueva (sb_publishable_...) va solo como apikey.
const cabDb = (token) => ({ apikey: ANON, ...(token ? { Authorization: 'Bearer ' + token } : ANON.startsWith('eyJ') ? { Authorization: 'Bearer ' + ANON } : {}) });
const sesionDe = (j) => ({ access: j.access_token, refresh: j.refresh_token, vence: Date.now() + (Number(j.expires_in) || 3600) * 1000 });
const conTiempo = (ms) => (typeof AbortSignal !== 'undefined' && AbortSignal.timeout ? AbortSignal.timeout(ms) : undefined);

// Revisa la dirección y la clave. La clave secreta (service_role o sb_secret_) se salta todas las reglas
// de la base: si alguien la pone acá por error, el panel no la usa y avisa.
function problemaConfig() {
  if (!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(SUPA)) return 'La dirección de Supabase del panel tiene que ser https://<proyecto>.supabase.co. Pasásela de nuevo al desarrollador.';
  let rol = '';
  if (ANON.startsWith('eyJ')) { try { rol = String(JSON.parse(atob(ANON.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).role || ''); } catch (e) {} }
  if (ANON.startsWith('sb_secret_') || (rol && rol !== 'anon')) return 'La clave de Supabase que tiene el panel es la SECRETA (service_role o secret key) y no puede estar en una página pública. Hay que sacarla ya del panel, cambiarla en Supabase (Project Settings → API) y poner en su lugar la anon public key.';
  return '';
}

// Cierra en Supabase una sesión que ya no se usa (scope=local: si el panel está abierto en otra compu, sigue funcionando).
const logoutDb = (token) => fetch(`${SUPA}/auth/v1/logout?scope=local`, { method: 'POST', keepalive: true, cache: 'no-store', signal: conTiempo(5000), headers: cabDb(token) }).catch(() => {});

// Entra con el usuario del panel y la misma contraseña de administrador. Nunca corta la entrada al panel:
// si falla, deja escrito en supaProblema qué falta y el panel sigue con GitHub.
// Con la sesión recordada no hay contraseña: se entra con el refresh_token que quedó guardado.
async function entrarDb(pass, refresh = null) {
  const id = ++sesionDb;
  supa = null; supaProblema = ''; dbConContenido = true; dbPendiente = false;
  if (!hayDb()) return;
  const mal = problemaConfig();
  if (mal) { supaProblema = mal; return; }
  if (!pass && !refresh) { supaProblema = 'Para conectar la base en línea, tocá Salir y volvé a entrar con tu contraseña.'; return; }
  try {
    const r = await fetch(`${SUPA}/auth/v1/token?grant_type=${refresh ? 'refresh_token' : 'password'}`, {
      method: 'POST', cache: 'no-store', signal: conTiempo(15000),
      headers: { apikey: ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify(refresh ? { refresh_token: refresh } : { email: SUPA_EMAIL, password: pass }),
    });
    const j = await r.json().catch(() => ({}));
    // Si mientras tanto falló GitHub o se salió del panel, esta sesión no se usa: se cierra.
    if (id !== sesionDb) { if (r.ok && j.access_token) logoutDb(j.access_token); return; }
    if (r.ok && j.access_token && j.refresh_token) { supa = sesionDe(j); guardarRecordado(); return; }
    if (refresh) { supaProblema = 'Se venció la sesión guardada con la base en línea. Tocá Salir y volvé a entrar con tu contraseña.'; return; }
    const cod = String(j.error_code || j.error || ''), detalle = String(j.msg || j.error_description || '');
    if (cod === 'email_not_confirmed' || /not confirmed/i.test(detalle)) supaProblema = `El usuario ${SUPA_EMAIL} existe en Supabase pero no está confirmado. En Authentication → Users borralo y crealo de nuevo marcando Auto Confirm User.`;
    else if (r.status === 429) supaProblema = 'Supabase está frenando los intentos de entrada. Esperá unos minutos, salí del panel y volvé a entrar.';
    else if (r.status === 401 || /api key/i.test(detalle)) supaProblema = 'Supabase no reconoce la anon key del panel. Pasale de nuevo al desarrollador la Project URL y la anon public key.';
    else if (r.status === 400 || cod === 'invalid_credentials' || cod === 'invalid_grant') supaProblema = `Falta crear el usuario del panel en Supabase, o tiene otra contraseña. En Authentication → Users → Add user creá ${SUPA_EMAIL} con la misma contraseña de administrador de este panel y marcá Auto Confirm User. Después salí y volvé a entrar.`;
    else supaProblema = `Supabase no dejó entrar (error ${r.status}). Salí del panel y volvé a entrar en un rato.`;
  } catch (e) {
    if (id !== sesionDb) return;
    supaProblema = 'No se pudo conectar con Supabase. Revisá internet, salí del panel y volvé a entrar.';
  }
  // ¿La app ya está leyendo contenido de la base? (para avisar bien qué pasa mientras no se conecte)
  try {
    const r = await fetch(`${SUPA}/rest/v1/contenido?select=id&id=eq.1`, { cache: 'no-store', signal: conTiempo(10000), headers: cabDb(null) });
    const xs = r.ok ? await r.json() : null;
    if (id === sesionDb && Array.isArray(xs)) dbConContenido = xs.length > 0;
  } catch (e) {}
}

// Devuelve un access_token vigente; si está por vencer lo renueva con el refresh_token (una sola renovación a la vez).
async function tokenDb() {
  if (!supa) return null;
  if (supa.vence - Date.now() > 60000) return supa.access;
  if (!renovando) {
    const id = sesionDb, refresh = supa.refresh;
    renovando = (async () => {
      let r, j;
      try {
        r = await fetch(`${SUPA}/auth/v1/token?grant_type=refresh_token`, {
          method: 'POST', cache: 'no-store', signal: conTiempo(15000),
          headers: { apikey: ANON, 'Content-Type': 'application/json' },
          body: JSON.stringify({ refresh_token: refresh }),
        });
        j = await r.json().catch(() => ({}));
      } catch (e) { throw new Error('No se pudo conectar con la base en línea. Revisá internet y probá de nuevo.'); }
      if (id !== sesionDb) { if (r.ok && j.access_token) logoutDb(j.access_token); return; }
      if (r.ok && j.access_token && j.refresh_token) { supa = sesionDe(j); guardarRecordado(); return; }
      supa = null;
      supaProblema = 'Se cortó la sesión con la base en línea. Salí del panel y volvé a entrar.';
      pintarAvisoDb();
    })().finally(() => { renovando = null; });
  }
  await renovando;
  return supa ? supa.access : null;
}

// Consulta REST. Sin sesión de administrador solo se puede leer (con la anon key).
async function db(ruta, opciones = {}) {
  if (!hayDb()) throw new Error('La base en línea todavía no está activada.');
  const mal = problemaConfig();
  if (mal) throw new Error(mal);
  const token = await tokenDb();
  if (!token && (opciones.method || 'GET') !== 'GET') throw new Error(supaProblema || 'Falta conectar la base en línea.');
  try {
    return await fetch(`${SUPA}/rest/v1/${ruta}`, {
      ...opciones, cache: 'no-store', signal: conTiempo(20000),
      headers: { ...cabDb(token), 'Content-Type': 'application/json', ...(opciones.headers || {}) },
    });
  } catch (e) { throw new Error('No se pudo conectar con la base en línea. Revisá internet y probá de nuevo.'); }
}

async function errorDb(r) {
  const j = await r.json().catch(() => ({}));
  const cod = String(j.code || '');
  // 42703 / PGRST204: falta una columna nueva (campana, visible): la base tiene una versión vieja de setup.sql.
  if (['PGRST205', '42P01', 'PGRST202', '42883', 'PGRST204', '42703'].includes(cod)) return new Error('Faltan tablas o columnas en la base en línea: corré de nuevo el archivo supabase/setup.sql en el SQL Editor de Supabase.');
  if (cod === '42501' || r.status === 403) return new Error(`La base no lo permitió: el panel tiene que entrar con el usuario ${SUPA_EMAIL} y hay que haber corrido supabase/setup.sql.`);
  if (r.status === 401) return new Error('Se venció la sesión con la base en línea. Salí del panel y volvé a entrar.');
  if (cod === '23514' || cod === '22P02') return new Error('La base rechazó los datos porque no tienen el formato acordado.');
  return new Error('La base en línea respondió con un error (' + String(j.message || r.status).slice(0, 160) + ').');
}

// Borra una fila por id y confirma que de verdad se borró (si la base no deja, no da error: devuelve 0 filas).
async function dbBorrar(tabla, id) {
  const filtro = 'id=eq.' + encodeURIComponent(String(id));
  const r = await db(`${tabla}?${filtro}`, { method: 'DELETE', headers: { Prefer: 'return=representation' } });
  if (!r.ok) throw await errorDb(r);
  const borradas = await r.json().catch(() => null);
  if (Array.isArray(borradas) && borradas.length) return;
  const r2 = await db(`${tabla}?select=id&${filtro}`);
  const siguen = r2.ok ? await r2.json().catch(() => []) : [];
  if (Array.isArray(siguen) && siguen.length) throw new Error(`La base no dejó borrarlo: el panel tiene que entrar con el usuario ${SUPA_EMAIL} y hay que haber corrido supabase/setup.sql.`);
}

// Contenido: la misma copia que se guarda en GitHub va a la fila id=1 (la app la escucha en tiempo real).
async function contenidoADb(json) {
  if (!hayDb()) return { estado: 'apagada' };
  if (!supa) return { estado: 'sin-sesion' };
  try {
    const r = await db('contenido?on_conflict=id', { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify({ id: 1, json, actualizado: new Date().toISOString() }) });
    if (!r.ok) throw await errorDb(r);
    dbPendiente = false; dbConContenido = true;
    return { estado: 'ok' };
  } catch (e) { dbPendiente = true; return { estado: 'error', motivo: e.message }; }
}

// Al entrar: la app usa la copia de la base y no la de GitHub. Si esa copia quedó distinta de contenido.json
// (se guardó mientras la base no andaba, o alguien cambió el archivo directo en GitHub), se pone al día sola.
// Si todavía no hay copia, se crea: desde ahí la app recibe al instante lo que se guarde.
const canon = (x) => Array.isArray(x) ? '[' + x.map(canon).join(',') + ']'
  : x && typeof x === 'object' ? '{' + Object.keys(x).sort().map((k) => JSON.stringify(k) + ':' + canon(x[k])).join(',') + '}' : JSON.stringify(x);
let textoGh = '', sincronizando = null;

async function sincronizarContenido() {
  const id = sesionDb, shaGh = sha;
  const decir = (t, clase) => { if (!sucio) { $('#estado').textContent = t; $('#estado').className = 'estado ' + clase; } };
  try {
    const gh = JSON.parse(textoGh);
    const r = await db('contenido?select=json&id=eq.1');
    if (!r.ok) throw await errorDb(r);
    const xs = await r.json();
    const fila = Array.isArray(xs) && xs.length ? xs[0] : null;
    if (id !== sesionDb || (fila && canon(fila.json) === canon(gh))) return;
    // Si otro panel guardó después de que este entró, ya mandó a la base su versión, que es más nueva: no se pisa.
    const r2 = await api(`contents/${ARCHIVO}`);
    if (!r2.ok) throw new Error('no se pudo revisar GitHub (' + r2.status + ').');
    if ((await r2.json()).sha !== shaGh || id !== sesionDb) return;
    const res = await contenidoADb(gh);
    if (id !== sesionDb) return;
    if (res.estado !== 'ok') throw new Error(res.motivo || supaProblema || 'falta conectar la base en línea.');
    decir(fila ? 'La app tenía una versión anterior del contenido: ya quedó igual a lo guardado.' : 'Listo: desde ahora lo que guardes se ve al instante en la app.', 'ok');
  } catch (e) {
    if (id !== sesionDb) return;
    dbPendiente = true;
    $('#guardar').disabled = false;
    decir('La app puede no tener la última versión del contenido: ' + e.message + ' Tocá "Guardar cambios" para reintentar.', 'error');
  }
}

const avisoBien = (h) => ['id', 'fecha', 'titulo', 'texto', 'titulo_en', 'texto_en', 'accion', 'link'].every((k) => typeof h[k] === 'string')
  && ACCIONES_PUSH.some(([a]) => a === h.accion) && (h.accion === 'link' ? esHttps(h.link) : h.link === '');
const filaAviso = (h) => ({ id: h.id, titulo: h.titulo, texto: h.texto, titulo_en: h.titulo_en, texto_en: h.texto_en, accion: h.accion, link: h.accion === 'link' ? h.link : '', fecha: new Date(h.fecha).toISOString() });

async function insertarAvisos(xs) {
  const r = await db('avisos?on_conflict=id', { method: 'POST', headers: { Prefer: 'resolution=ignore-duplicates,return=minimal' }, body: JSON.stringify(xs.map(filaAviso)) });
  if (!r.ok) throw await errorDb(r);
}

// Migración única: si la tabla de avisos está vacía, se le pasan los avisos que ya estaban en GitHub.
async function migrarAvisos() {
  try {
    const r = await db('avisos?select=id&limit=1');
    if (!r.ok) return;
    const hay = await r.json().catch(() => null);
    if (!Array.isArray(hay) || hay.length || !datos) return;
    const viejos = datos.push_historial.filter((h) => avisoBien(h) && h.id && !isNaN(new Date(h.fecha)));
    if (viejos.length) await insertarAvisos(viejos);
  } catch (e) { return 'No se pudieron pasar a la base en línea los avisos que ya estaban (' + e.message + ') Salí del panel y volvé a entrar para reintentar.'; }
  return '';
}

// Cambia la contraseña del usuario del panel en Supabase para que siga siendo la misma que la del panel.
async function cambiarPassDb(nueva) {
  if (!hayDb()) return null;
  if (!supa) return { ok: false, texto: `Acordate: en Supabase el usuario ${SUPA_EMAIL} tiene que tener esta contraseña nueva.` };
  try {
    const token = await tokenDb();
    if (!token) throw new Error('se cortó la sesión');
    const r = await fetch(`${SUPA}/auth/v1/user`, { method: 'PUT', cache: 'no-store', signal: conTiempo(15000), headers: { ...cabDb(token), 'Content-Type': 'application/json' }, body: JSON.stringify({ password: nueva }) });
    const j = await r.json().catch(() => ({}));
    if (r.ok || j.error_code === 'same_password') return { ok: true, texto: 'También se cambió en la base en línea.' };
    throw new Error(String(j.msg || j.error_description || j.message || 'error ' + r.status).slice(0, 120));
  } catch (e) {
    return { ok: false, texto: `Pero no se pudo cambiar en Supabase (${e.message}). Para arreglarlo, en Supabase → Authentication → Users borrá ${SUPA_EMAIL} y crealo de nuevo con la contraseña nueva, marcando Auto Confirm User.` };
  }
}

function salirDb() {
  const s = supa;

}

// Supabase devuelve hasta 1000 filas por consulta: se piden de a 1000 hasta traer todas.
async function leerTodas(ruta) {
  const todas = [];
  for (let desde = 0; ; desde += 1000) {
    const r = await db(`${ruta}&limit=1000&offset=${desde}`);
    if (!r.ok) throw await errorDb(r);
    const xs = await r.json();
    const filas = (Array.isArray(xs) ? xs : []).filter((x) => x && typeof x === 'object');
    todas.push(...filas);
    if (filas.length < 1000) break;
  }
  return todas;
}

const campanaNormal = (c) => ({ id: String(c.id), nombre: String(c.nombre || ''), codigo: String(c.codigo || ''), activa: c.activa === true, creada: String(c.creada || '') });
const campanaDe = (id) => (muro.campanas || []).find((c) => c.id === id) || (camp.lista || []).find((c) => c.id === id) || null;

function pintarMuro(v) {
  const titulo = el('h2', { text: 'Pedidos de oración' });
  const explica = el('p', { class: 'ayuda', text: 'Los pedidos de oración son privados: la gente los manda desde la app y acá los ves todos, con el nombre y el celular de quien lo mandó (aunque haya elegido "anónimo"). Nadie más los ve. Los que llegan a una campaña quedan pendientes hasta que toques "Mostrar en la campaña": desde ahí los ven solo las personas que pusieron el código de esa campaña. Si no querés publicarlo, tocá "No mostrar" (a quien lo mandó le aparece "Lo recibió el equipo"). Con "Ocultar" sacás uno que ya estaba publicado. Los "solo para el equipo" no se muestran en ningún lado.' });
  cajaMuro = botonMuro = filtrosMuro = cuentaMuro = null;
  if (!hayDb()) {
    pararMuro();
    v.replaceChildren(titulo, explica, el('div', { class: 'card alerta' }, el('b', { text: 'Falta activar la base en línea (se hace una sola vez)' }), pasosSupabase()));
    return;
  }
  // Dirección o clave mal puestas en el panel: no hay nada que leer hasta que el desarrollador las corrija.
  const mal = problemaConfig();
  if (mal) {
    pararMuro();
    v.replaceChildren(titulo, el('div', { class: 'card alerta' }, el('b', { text: 'La base en línea está mal configurada en el panel' }), el('p', { class: 'ayuda', style: 'margin:6px 0 0', text: mal })));
    return;
  }
  // Los pedidos solo los puede leer el usuario del panel: sin esa sesión la base no devuelve nada.
  if (!supa) {
    pararMuro();
    v.replaceChildren(titulo, explica, el('div', { class: 'card alerta' }, el('b', { text: 'Para ver los pedidos falta conectar el usuario del panel' }), el('p', { class: 'ayuda', style: 'margin:6px 0 0', text: supaProblema || 'Salí del panel y volvé a entrar.' })));
    return;
  }
  cuentaMuro = el('span', { class: 'chip aprox oculto' });
  titulo.append(cuentaMuro);
  const selCamp = el('select', { id: 'filtroCamp' });
  const selEstado = el('select', { id: 'filtroEstado' }, ...[['pendientes', 'Pendientes'], ['publicados', 'Publicados'], ['rechazados', 'No publicados'], ['todos', 'Todos']].map(([val, t]) => el('option', { value: val, text: t })));
  const filtrar = () => { muro.pedidos = null; cargarMuro(); pintarListaMuro(); };
  selCamp.addEventListener('change', () => { muro.filtroCamp = selCamp.value; filtrar(); });
  selEstado.addEventListener('change', () => { muro.filtroEstado = selEstado.value; filtrar(); });
  filtrosMuro = { camp: selCamp, estado: selEstado };
  botonMuro = el('button', { class: 'btn sec', type: 'button', text: 'Actualizar', on: { click: () => cargarMuro() } });
  cajaMuro = el('div');
  v.replaceChildren(titulo, explica,
    el('div', { class: 'fila' },
      el('div', {}, el('label', { for: 'filtroCamp', text: 'Campaña' }), selCamp),
      el('div', {}, el('label', { for: 'filtroEstado', text: 'Estado' }), selEstado)),
    el('div', { class: 'acciones', style: 'margin:12px 0 4px;align-items:center' }, botonMuro,
      el('span', { class: 'ayuda', style: 'margin:0', text: 'Mientras tengas esta pestaña abierta, la lista se actualiza sola cada 20 segundos.' })),
    cajaMuro);
  pintarListaMuro();
  if (!relojMuro) relojMuro = setInterval(() => {
    if (tab !== 'muro' || !datos) { pararMuro(); return; }
    if (!document.hidden && !muro.cargando) cargarMuro();
  }, 20000);
  if (!muro.cargando && Date.now() - muro.cuando > 5000) cargarMuro();
}

// La lista se filtra en la base (así un pendiente viejo no queda afuera por los 300 más nuevos).
function rutaPedidos(f) {
  const q = ['select=id,texto,cat,nombre,anonimo,autor,fecha,oraron,contestada,testimonio,idioma,campana,visible,revisado', 'order=fecha.desc,id.asc', 'limit=' + LIMITE_PEDIDOS];
  if (f.camp === 'equipo') q.push('campana=is.null');
  else {
    if (f.camp !== 'todas') q.push('campana=eq.' + encodeURIComponent(f.camp));
    else if (f.estado === 'pendientes') q.push('campana=not.is.null');
    // Pendiente = el panel todavía no decidió; "no publicado" = el panel eligió no mostrarlo.
    if (f.estado === 'pendientes') q.push('revisado=eq.false');
    else if (f.estado === 'publicados') q.push('visible=eq.true');
    else if (f.estado === 'rechazados') q.push('visible=eq.false', 'revisado=eq.true');
  }
  return 'pedidos?' + q.join('&');
}

// Nombre, apellido y celular del registro de cada autor (de a 80 por consulta, para no hacer una dirección gigante).
async function personasDe(autores) {
  const ids = [...new Set(autores.map(String))].filter((x) => /^[0-9a-f-]{36}$/i.test(x));
  const mapa = new Map();
  for (let i = 0; i < ids.length; i += 80) {
    const r = await db('registros?select=id,nombre,apellido,celular&id=in.(' + ids.slice(i, i + 80).join(',') + ')');
    if (!r.ok) throw await errorDb(r);
    const xs = await r.json();
    for (const x of Array.isArray(xs) ? xs : []) if (x && typeof x === 'object' && x.id != null) mapa.set(String(x.id), x);
  }
  return mapa;
}

async function cargarMuro() {
  if (!hayDb() || !supa) return;
  const m = muro;
  if (m.cargando) { m.repetir = true; return; }
  m.cargando = true; m.repetir = false;
  const f = { camp: m.filtroCamp, estado: m.filtroEstado };
  pintarListaMuro();
  try {
    const [rp, cs, sinMostrar] = await Promise.all([
      db(rutaPedidos(f)),
      leerTodas('campanas?select=id,nombre,codigo,activa,creada&order=creada.desc,id.asc'),
      leerTodas('pedidos?select=campana&revisado=eq.false&order=id.asc'),
    ]);
    if (!rp.ok) throw await errorDb(rp);
    const xs = await rp.json();
    const pedidos = (Array.isArray(xs) ? xs : []).filter((p) => p && typeof p === 'object' && p.id != null);
    // Pendientes por campaña (para el título y el filtro) y cuántos hay solo para el equipo.
    const pendientes = new Map();
    let equipo = 0;
    for (const p of sinMostrar) {
      if (p.campana == null) equipo++;
      else pendientes.set(String(p.campana), (pendientes.get(String(p.campana)) || 0) + 1);
    }
    m.campanas = cs.filter((c) => c.id != null).map(campanaNormal);
    m.pendientes = pendientes; m.equipo = equipo; m.hayCuentas = true;
    // Quién mandó cada uno. Si esto falla, igual se muestran los pedidos.
    try { m.personas = await personasDe(pedidos.map((p) => p.autor)); m.errorPersonas = ''; }
    catch (e) { m.errorPersonas = e.message; }
    // Si mientras tanto cambió el filtro, esta lista ya no sirve: se vuelve a pedir.
    if (f.camp === m.filtroCamp && f.estado === m.filtroEstado) m.pedidos = pedidos;
    else m.repetir = true;
    m.error = '';
  } catch (e) { m.error = e.message; }
  finally {
    m.cuando = Date.now(); m.cargando = false;
    if (m === muro) { if (m.repetir) cargarMuro(); else pintarListaMuro(); }
  }
}

// Las opciones del filtro de campaña se rehacen solo si cambiaron (así no se cierra la lista si está abierta).
function pintarFiltrosMuro() {
  if (!filtrosMuro) return;
  const { camp: selCamp, estado: selEstado } = filtrosMuro;
  const cs = muro.campanas || [];
  const elegida = !['todas', 'equipo'].includes(muro.filtroCamp);
  // La campaña elegida ya no existe (la borraron): se vuelve a "Todas".
  if (elegida && muro.campanas && !muro.cargando && !cs.some((c) => c.id === muro.filtroCamp)) {
    muro.filtroCamp = 'todas'; muro.pedidos = null;
    setTimeout(cargarMuro, 0);
  }
  const pend = (id) => muro.pendientes.get(id) || 0;
  const opciones = [
    ['todas', 'Todas'],
    ['equipo', 'Solo para el equipo' + (muro.hayCuentas && muro.equipo ? ` (${muro.equipo})` : '')],
    ...cs.map((c) => [c.id, c.nombre + (c.activa ? '' : ' (pausada)') + (pend(c.id) ? ' · ' + plural(pend(c.id), 'pendiente', 'pendientes') : '')]),
  ];
  if (!opciones.some(([val]) => val === muro.filtroCamp)) opciones.push([muro.filtroCamp, 'La campaña elegida']);
  const firma = JSON.stringify(opciones);
  if (selCamp.dataset.firma !== firma) {
    selCamp.replaceChildren(...opciones.map(([val, t]) => el('option', { value: val, text: t })));
    selCamp.dataset.firma = firma;
  }
  selCamp.value = muro.filtroCamp;
  selEstado.value = muro.filtroEstado;
  selEstado.disabled = muro.filtroCamp === 'equipo';
  selEstado.title = selEstado.disabled ? 'No aplica: los pedidos solo para el equipo no se muestran en ninguna campaña.' : '';
}

function textoVacioMuro() {
  const enCamp = !['todas', 'equipo'].includes(muro.filtroCamp) ? ' en esta campaña' : '';
  if (muro.filtroCamp === 'equipo') return 'No hay pedidos solo para el equipo.';
  if (muro.filtroEstado === 'pendientes') return 'No hay pedidos pendientes' + enCamp + '.';
  if (muro.filtroEstado === 'publicados') return 'No hay pedidos publicados' + enCamp + '.';
  return 'Todavía no llegó ningún pedido' + enCamp + '.';
}

function pintarListaMuro() {
  if (botonMuro) botonMuro.disabled = muro.cargando;
  if (!cajaMuro || !cajaMuro.isConnected) return;
  pintarFiltrosMuro();
  // Contador de pendientes (de todas las campañas) en el título.
  if (cuentaMuro) {
    const total = [...muro.pendientes.values()].reduce((a, b) => a + b, 0);
    cuentaMuro.className = 'chip ' + (total ? 'aprox' : 'verde') + (muro.hayCuentas ? '' : ' oculto');
    cuentaMuro.textContent = total ? plural(total, 'pendiente', 'pendientes') : 'Nada pendiente';
  }
  const hijos = [];
  const n = muro.pedidos ? muro.pedidos.length : 0;
  const hora = muro.cuando ? new Date(muro.cuando).toLocaleTimeString('es-UY', { hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' }) : '';
  hijos.push(el('p', { class: 'ayuda', 'aria-live': 'polite', text: muro.cargando ? 'Actualizando...' : hora && muro.pedidos
    ? `Actualizado a las ${hora}. ${plural(n, 'pedido', 'pedidos')}` + (n >= LIMITE_PEDIDOS ? ` (se muestran los ${LIMITE_PEDIDOS} más nuevos).` : '.')
    : hora ? `Actualizado a las ${hora}.` : '' }));
  if (notaVigente(muro.msg)) hijos.push(el('p', { class: 'ayuda ' + (muro.msg.ok ? 'ok' : 'error'), text: muro.msg.texto }));
  if (muro.error) hijos.push(el('p', { class: 'ayuda error', text: muro.error }));
  if (muro.errorPersonas) hijos.push(el('p', { class: 'ayuda error', text: 'No pude leer quién mandó cada pedido: ' + muro.errorPersonas }));
  if (muro.filtroCamp === 'todas' && muro.filtroEstado === 'pendientes' && muro.equipo > 0) {
    hijos.push(el('p', { class: 'ayuda' }, `Además hay ${plural(muro.equipo, 'pedido', 'pedidos')} solo para el equipo (no van a ninguna campaña): `,
      el('a', { href: '#', text: 'verlos', on: { click: (e) => { e.preventDefault(); muro.filtroCamp = 'equipo'; muro.pedidos = null; cargarMuro(); pintarListaMuro(); } } }), '.'));
  }
  if (muro.pedidos) hijos.push(...(n ? muro.pedidos.map(tarjetaPedido) : [el('p', { class: 'ayuda', text: textoVacioMuro() })]));
  cajaMuro.replaceChildren(...hijos);
}

// Todo lo del pedido lo escribe la persona desde la app: se muestra siempre como texto (textContent), nunca como HTML.
function tarjetaPedido(p) {
  const c = p.campana ? campanaDe(String(p.campana)) : null;
  const publico = p.anonimo || !String(p.nombre || '').trim() ? 'Anónimo' : String(p.nombre).trim();
  const oraron = Math.max(0, Number(p.oraron) || 0);
  const testimonio = String(p.testimonio || '').trim();
  const persona = muro.personas.get(String(p.autor));
  const num = persona ? soloNumeros(persona.celular) : '';
  const de = persona ? [nombreReg(persona) || '(sin nombre)', String(persona.celular || '').trim()].filter(Boolean).join(' · ')
    : muro.errorPersonas ? 'no se pudo leer' : 'sin datos de registro (los borraron o todavía no los completó)';
  const botones = [];
  // Los "solo para el equipo" no tienen dónde mostrarse: solo se pueden borrar.
  if (p.campana) {
    const b = p.visible
      ? el('button', { class: 'btn sec chico', type: 'button', text: 'Ocultar' })
      : el('button', { class: 'btn chico', type: 'button', text: 'Mostrar en la campaña' });
    b.addEventListener('click', () => cambiarVisible(p, !p.visible, b));
    botones.push(b);
    // Pendiente: también se puede decidir no mostrarlo (a quien lo mandó le queda "Lo recibió el equipo").
    if (!p.visible && !p.revisado) {
      const no = el('button', { class: 'btn sec chico', type: 'button', text: 'No mostrar' });
      no.addEventListener('click', () => cambiarVisible(p, false, no));
      botones.push(no);
    }
  }
  if (num.length >= 6) botones.push(el('a', { class: 'btn sec chico reg-wa', href: 'https://wa.me/' + num, target: '_blank', rel: 'noopener noreferrer', text: 'WhatsApp' }));
  const borrar = el('button', { class: 'btn peligro chico', type: 'button', text: 'Borrar' });
  borrar.addEventListener('click', () => borrarPedido(p, borrar));
  botones.push(borrar);
  return el('div', { class: 'card' },
    el('div', { class: 'meta', style: 'margin:0' },
      p.campana
        ? el('span', { class: 'chip', text: 'Campaña: ' + (c ? c.nombre + (c.activa ? '' : ' (pausada)') : '(sin nombre)') })
        : el('span', { class: 'chip equipo', text: 'Solo para el equipo' }),
      el('span', { class: 'chip gris', text: String(p.cat || 'Otro') }),
      p.campana ? el('span', { class: p.visible ? 'chip verde' : p.revisado ? 'chip gris' : 'chip aprox', text: p.visible ? 'Publicado' : p.revisado ? 'No publicado' : 'Pendiente' }) : null,
      p.contestada ? el('span', { class: 'chip verde', text: 'Contestada' }) : null,
      p.idioma === 'en' ? el('span', { class: 'chip gris', text: 'En inglés' }) : null),
    el('p', { class: 'pedido-texto', text: String(p.texto || '') }),
    el('p', { class: 'meta', text: [(p.campana ? 'Se ve como: ' : 'Nombre: ') + publico, fechaLinda(p.fecha), p.campana && (p.visible || oraron) ? plural(oraron, 'persona oró', 'personas oraron') : ''].filter(Boolean).join(' · ') }),
    el('div', { class: 'de' }, el('b', { text: 'De: ' }), de,
      p.anonimo ? el('small', { text: p.campana ? 'Anónimo para los demás: en la campaña aparece como "Anónimo".' : 'Lo mandó como anónimo.' }) : null),
    p.contestada && testimonio ? el('div', { class: 'testimonio' }, el('b', { text: 'Testimonio: ' }), testimonio) : null,
    el('div', { class: 'acciones' }, ...botones));
}

// Mostrar u ocultar en su campaña. Se confirma con la fila que devuelve la base (si no deja, devuelve 0 filas).
async function cambiarVisible(p, visible, boton) {
  boton.disabled = true;
  const c = campanaDe(String(p.campana));
  try {
    const r = await db('pedidos?id=eq.' + encodeURIComponent(String(p.id)) + '&select=id,visible,revisado', { method: 'PATCH', headers: { Prefer: 'return=representation' }, body: JSON.stringify({ visible, revisado: true }) });
    if (!r.ok) throw await errorDb(r);
    const xs = await r.json().catch(() => null);
    if (!Array.isArray(xs) || !xs.length || xs[0].visible !== visible) throw new Error(`La base no dejó cambiarlo: el panel tiene que entrar con el usuario ${SUPA_EMAIL} y hay que haber corrido supabase/setup.sql.`);
    const eraPendiente = !p.revisado;
    p.visible = visible; p.revisado = true;
    const k = String(p.campana);
    if (eraPendiente) muro.pendientes.set(k, Math.max(0, (muro.pendientes.get(k) || 0) - 1));
    // Si con el filtro de estado ya no corresponde, sale de la lista.
    const sigue = { todos: true, pendientes: false, publicados: visible, rechazados: !visible }[muro.filtroEstado];
    if (muro.pedidos && !sigue) muro.pedidos = muro.pedidos.filter((x) => x.id !== p.id);
    camp.cuando = 0;
    const nombre = c ? `"${c.nombre}"` : '';
    muro.msg = nota(true, visible
      ? `Listo: ya lo ven en la campaña ${nombre}.` + (c && !c.activa ? ' Ojo: la campaña está pausada, así que se va a ver cuando la vuelvas a activar.' : '')
      : eraPendiente ? `Listo: no se publica en la campaña ${nombre}. A quien lo mandó le aparece "Lo recibió el equipo".`
      : `Listo: ya no se ve en la campaña ${nombre}. A los celulares que la tienen abierta se les va en menos de un minuto.`);
  } catch (e) { muro.msg = nota(false, 'No se cambió: ' + e.message); boton.disabled = false; }
  pintarListaMuro();
}

async function borrarPedido(p, boton) {
  const resumen = String(p.texto || '').slice(0, 140);
  const extra = p.campana && p.visible ? ' También se saca al instante de la campaña.' : '';
  if (!confirm(`¿Borrar este pedido de oración? Se borra para siempre, también de "Mis pedidos" de quien lo mandó.${extra} No se puede deshacer.\n\n"${resumen}"`)) return;
  boton.disabled = true;
  try {
    await dbBorrar('pedidos', p.id);
    if (muro.pedidos) muro.pedidos = muro.pedidos.filter((x) => x.id !== p.id);
    if (!p.revisado) {
      if (p.campana == null) muro.equipo = Math.max(0, muro.equipo - 1);
      else { const k = String(p.campana); muro.pendientes.set(k, Math.max(0, (muro.pendientes.get(k) || 0) - 1)); }
    }
    camp.cuando = 0;
    muro.msg = nota(true, 'Pedido borrado.');
  } catch (e) { muro.msg = nota(false, 'No se borró: ' + e.message); boton.disabled = false; }
  pintarListaMuro();
}

// ---------- Campañas de oración: grupos privados con un código (las crea y las maneja solo el panel) ----------
// En la app, la persona pone el código y queda unida a la campaña: ve sus pedidos aprobados y puede mandar los suyos.
const campVacio = () => ({ lista: null, cuentas: new Map(), error: '', cuando: 0, cargando: false, msg: null });
let camp = campVacio(), cajaCamp = null, botonesCamp = [];
const LETRAS_CODIGO = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // sin I, O, 0 ni 1, que se confunden al dictarlos
const codigoAlAzar = () => Array.from(crypto.getRandomValues(new Uint8Array(6)), (b) => LETRAS_CODIGO[b % LETRAS_CODIGO.length]).join('');
const mensajeCampana = (c) => `Sumate a la campaña de oración "${c.nombre}" en la app Carpa del Encuentro: entrá a Oración, buscá Campañas de oración y poné el código ${c.codigo}.`;
const plural = (n, uno, varios) => (n === 1 ? '1 ' + uno : n + ' ' + varios);
const cuentasVacias = () => ({ personas: 0, pendientes: 0, publicados: 0 });

function pintarCampanas(v) {
  const titulo = el('h2', { text: 'Campañas de oración' });
  const explica = el('p', { class: 'ayuda', text: 'Cada campaña es un grupo privado de oración con su propio código. En la app, la persona entra a Oración → Campañas de oración y pone el código: desde ahí ve los pedidos de esa campaña que vos aprobaste y puede mandar los suyos. Sin el código no se ve nada. Los pedidos nuevos llegan a la pestaña Pedidos de oración y no aparecen en la campaña hasta que toques "Mostrar en la campaña".' });
  cajaCamp = null; botonesCamp = [];
  if (!hayDb()) { v.replaceChildren(titulo, explica, el('div', { class: 'card alerta' }, el('b', { text: 'Falta activar la base en línea (se hace una sola vez)' }), pasosSupabase())); return; }
  const mal = problemaConfig();
  if (mal) { v.replaceChildren(titulo, el('div', { class: 'card alerta' }, el('b', { text: 'La base en línea está mal configurada en el panel' }), el('p', { class: 'ayuda', style: 'margin:6px 0 0', text: mal }))); return; }
  // Las campañas las crea y las ve solo el usuario del panel: sin esa sesión la base no devuelve nada.
  if (!supa) { v.replaceChildren(titulo, explica, el('div', { class: 'card alerta' }, el('b', { text: 'Para manejar las campañas falta conectar el usuario del panel' }), el('p', { class: 'ayuda', style: 'margin:6px 0 0', text: supaProblema || 'Salí del panel y volvé a entrar.' }))); return; }
  const nueva = el('button', { class: 'btn', type: 'button', text: '+ Nueva campaña', on: { click: nuevaCampana } });
  const actualizar = el('button', { class: 'btn sec', type: 'button', text: 'Actualizar', on: { click: () => cargarCampanas() } });
  botonesCamp = [actualizar];
  cajaCamp = el('div');
  v.replaceChildren(titulo, explica, el('div', { class: 'acciones', style: 'margin:0 0 12px' }, nueva, actualizar), cajaCamp);
  pintarListaCamp();
  if (!camp.cargando && Date.now() - camp.cuando > 5000) cargarCampanas();
}

async function cargarCampanas() {
  if (!hayDb() || !supa || camp.cargando) return;
  const m = camp;
  m.cargando = true;
  pintarListaCamp();
  try {
    // El panel ve todas las campañas, todos los miembros y todos los pedidos: con eso se cuentan.
    const [cs, ms, ps] = await Promise.all([
      leerTodas('campanas?select=id,nombre,codigo,activa,creada&order=creada.desc,id.asc'),
      leerTodas('miembros?select=campana&order=campana.asc,usuario.asc'),
      leerTodas('pedidos?select=campana,visible,revisado&campana=not.is.null&order=id.asc'),
    ]);
    const lista = cs.filter((c) => c.id != null).map(campanaNormal);
    const cuentas = new Map(lista.map((c) => [c.id, cuentasVacias()]));
    for (const x of ms) { const k = cuentas.get(String(x.campana)); if (k) k.personas++; }
    for (const p of ps) { const k = cuentas.get(String(p.campana)); if (k) { if (p.visible === true) k.publicados++; else if (p.revisado !== true) k.pendientes++; } }
    m.lista = lista; m.cuentas = cuentas; m.error = '';
  } catch (e) { m.error = e.message; }
  finally { m.cuando = Date.now(); m.cargando = false; if (m === camp) pintarListaCamp(); }
}

function pintarListaCamp() {
  for (const b of botonesCamp) b.disabled = camp.cargando;

async function copiar(texto) {
  try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(texto); return true; } } catch (e) {}
  try {
    const t = el('textarea', { value: texto, readonly: '', style: 'position:fixed;left:-9999px;top:0' });
    document.body.append(t); t.select();
    const ok = document.execCommand('copy');
    t.remove();
    return ok;
  } catch (e) { return false; }
}

function botonCopiar(texto, valor) {
  const b = el('button', { class: 'btn sec chico', type: 'button', text: texto });
  b.addEventListener('click', async () => {
    if (await copiar(valor())) { b.textContent = '¡Copiado!'; setTimeout(() => { b.textContent = texto; }, 2000); }
    else window.prompt('No pude copiarlo solo. Seleccionalo y copialo de acá:', valor());
  });
  return b;
}

function nuevaCampana() {
  abrirDialogo('Nueva campaña', [

  ], async (v) => {
    const nombre = v.nombre, codigo = v.codigo.toUpperCase();
    if (!nombre) return 'Escribí el nombre de la campaña.';
    if (nombre.length > 80) return 'El nombre puede tener hasta 80 letras.';
    // 6 o más: con códigos cortos se podría adivinar probando al azar.
    if (!/^[A-Z0-9]{6,12}$/.test(codigo)) return 'El código tiene que tener de 6 a 12 letras (sin Ñ ni tildes) o números, sin espacios.';
    if (!supa) return supaProblema || 'Falta conectar el usuario del panel. Salí del panel y volvé a entrar.';
    const r = await db('campanas', { method: 'POST', headers: { Prefer: 'return=representation' }, body: JSON.stringify({ nombre, codigo }) });
    if (!r.ok) {
      const j = await r.clone().json().catch(() => ({}));
      if (r.status === 409 || String(j.code || '') === '23505') return 'Ese código ya lo usa otra campaña. Elegí otro.';
      throw await errorDb(r);
    }

async function borrarCampana(c, k, boton) {

      const filas = (Array.isArray(xs) ? xs : []).filter((x) => x && typeof x === 'object' && x.id != null);

      if (filas.length < 1000) break;

    reg.filas = todas;
