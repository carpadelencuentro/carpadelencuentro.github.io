# Galería de la app: cada hora copia las fotos de la página de Facebook de la Carpa (scripts/galeria_facebook.py).
# Necesita el secreto FB_PAGE_TOKEN (Settings > Secrets and variables > Actions). Se puede correr a mano desde
# la pestaña Actions > "Galería desde Facebook" > Run workflow.
name: Galería desde Facebook

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/galeria-facebook.yml'
      - 'scripts/galeria_facebook.py'

permissions:
  contents: write

concurrency:
  group: galeria-facebook
  cancel-in-progress: false

jobs:
  galeria:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Traer las fotos de Facebook
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python3 scripts/galeria_facebook.py

      - name: Guardar si cambió algo
        run: |
          git config user.name "Galería automática"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A galeria.json
          if [ -d fotos/galeria ]; then git add -A fotos/galeria; fi
          if git diff --cached --quiet; then echo "Sin cambios."; exit 0; fi
          git commit -q -m "Galería: fotos de Facebook"
          git pull -q --rebase origin main
          git push -q
