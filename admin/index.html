// ---------- Cifrado ----------
// clave.json (público) guarda {v:2, iter, sal, iv, datos}: AES-GCM-256 con clave PBKDF2-SHA256 de la contraseña.
// Adentro va {github, firebase}. El formato viejo (sin "v", 310000 vueltas, solo el token) se acepta y se migra.
const ITER = 600000, ITER_VIEJO = 310000;
const b64 = (u8) => { let x = ''; for (let i = 0; i < u8.length; i += 0x8000) x += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(x); };
const deb64 = (t) => Uint8Array.from(atob(t), (c) => c.charCodeAt(0));
const b64url = (u8) => b64(u8).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const pemABytes = (pem) => deb64(String(pem).replace(/-----[A-Z ]+-----/g, '').replace(/\\n/g, '').replace(/\s+/g, ''));
const a64 = (s) => b64(new TextEncoder().encode(s));
const de64 = (s) => new TextDecoder().decode(deb64(s.replace(/\n/g, '')));

async function llave(pass, sal, iter = ITER) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: sal, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function cifrar(texto, pass) {
  const sal = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const c = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await llave(pass, sal, ITER), new TextEncoder().encode(texto));
  return { v: 2, iter: ITER, sal: b64(sal), iv: b64(iv), datos: b64(new Uint8Array(c)) };
}
async function descifrar(j, pass) {
  const iter = j.v === 2 ? j.iter : ITER_VIEJO;
  const c = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: deb64(j.iv) }, await llave(pass, deb64(j.sal), iter), deb64(j.datos));
  return new TextDecoder().decode(c);
}
async function abrirSecretos(j, pass) {
  const texto = await descifrar(j, pass);
  if (j.v !== 2) return { secretos: { github: texto.trim(), firebase: null }, viejo: true };
  const s = JSON.parse(texto);
  if (!s || typeof s.github !== 'string') throw new Error('formato');
  return { secretos: { github: s.github, firebase: s.firebase && typeof s.firebase === 'object' ? s.firebase : null }, viejo: false };
}
async function leerClaveCifrada() {
  const r = await api('contents/clave.json', {}, null);
  if (r.status === 404) return null;
  if (r.status === 403 || r.status === 429) throw new Error('GitHub está frenando las consultas. Esperá unos minutos y probá de nuevo.');
  if (!r.ok) throw new Error('No pude leer la configuración (' + r.status + ').');
  const j = await r.json();
  let c = null;
  try { c = JSON.parse(de64(j.content)); } catch (e) {}
  const valido = c && typeof c.sal === 'string' && typeof c.iv === 'string' && typeof c.datos === 'string' &&
    (c.v === undefined || (c.v === 2 && Number.isInteger(c.iter) && c.iter >= 100000 && c.iter <= 5000000));
  if (!valido) throw new Error('La configuración guardada está dañada.');
  return { ...c, sha: j.sha };
}
async function escribirClave(nuevos, pass, shaClave) {
  const cuerpo = { message: 'Panel: configuración de acceso', content: a64(JSON.stringify(await cifrar(JSON.stringify(nuevos), pass))) };
  if (shaClave) cuerpo.sha = shaClave;
  const r = await api('contents/clave.json', { method: 'PUT', body: JSON.stringify(cuerpo) }, nuevos.github);
  if (r.status === 401 || r.status === 403 || r.status === 404) throw new Error('La clave de GitHub no tiene permiso para guardar. Revisá que tenga Contents: Read and write.');
  if (r.status === 409 || r.status === 422) throw new Error('La configuración cambió mientras tanto. Recargá la página y probá de nuevo.');
  if (!r.ok) throw new Error('No pude guardar la configuración (' + r.status + ').');
}

// ---------- Datos ----------
async function cargar() {
  const r = await api(`contents/${ARCHIVO}`);
  if (r.status === 401) { const e = new Error('La clave de GitHub dejó de funcionar.'); e.vencida = true; throw e; }
  if (r.status === 403) throw new Error('La clave no tiene permiso. Revisá que tenga Contents: Read and write.');
  if (!r.ok) throw new Error('No encontré el archivo de datos (' + r.status + ').');
  const j = await r.json();
  sha = j.sha;
  textoGh = de64(j.content);
  datos = JSON.parse(textoGh);
  datos.config = datos.config || {}; datos.en = datos.en || {}; datos.noticias = datos.noticias || []; datos.iglesias = datos.iglesias || []; datos.misioneros = datos.misioneros || [];
  datos.push_historial = Array.isArray(datos.push_historial) ? datos.push_historial.filter((h) => h && typeof h === 'object') : [];
}

// Revisa lo que se va a guardar: links https, ids de YouTube y largos.
function revisar() {
  const cfg = datos.config;
  for (const [k, nombre] of [['envivo_url', 'El link de la transmisión'], ['actualizar_url', 'El link de Android'], ['actualizar_url_ios', 'El link de iPhone']]) {
    if (typeof cfg[k] === 'string') cfg[k] = cfg[k].trim();
    if (cfg[k] && !esHttps(cfg[k])) return nombre + ' tiene que empezar con https://';
  }
  if (cfg.version_app && !/^\d+(\.\d+){0,3}$/.test(String(cfg.version_app).trim())) return 'La versión tiene que ser solo números y puntos (ej: 1.0.1).';
  for (const n of datos.noticias) {
    if (n.video && !/^[\w-]{11}$/.test(n.video)) return 'Hay una novedad con un link de YouTube que no reconozco.';
    if (String(n.titulo || '').length > 150 || String(n.texto || '').length > 1500) return 'Hay una novedad con un texto demasiado largo.';
  }
  if (Array.isArray(datos.inicio)) {
    for (const s of datos.inicio) {
      if (!String(s.titulo || '').trim()) return 'Hay una sección de Inicio sin título.';
      if (!(esHttps(s.foto) || FOTOS_APP.some(([k]) => k === s.foto))) return `La sección "${s.titulo}" tiene una foto que la app no puede usar.`;
      if (!ACCIONES_INICIO.some(([k]) => k === s.accion)) s.accion = 'nada';
      if (s.accion === 'link' && !esHttps(s.link)) return `La sección "${s.titulo}" lleva a un link que no empieza con https://`;
      if (String(s.titulo).length > 60 || String(s.sub || '').length > 90 || String(s.pill || '').length > 24) return `La sección "${s.titulo}" tiene un texto demasiado largo.`;
    }
  }
  const fotoOk = (f) => !f || esHttps(f) || NOMBRE_FOTO_APP.test(f);
  for (const c of datos.iglesias) {
    if (!(c.fotos || []).every(fotoOk)) return `La iglesia ${c.ciudad || c.nombre} tiene una foto con un link que no empieza con https://`;
    if (!Number.isFinite(+c.lat) || !Number.isFinite(+c.lng)) return `La iglesia ${c.ciudad || c.nombre} no tiene bien la ubicación.`;
  }
  // Avisos enviados: la app los lee tal cual, así que tienen que respetar el formato acordado.
  for (const h of datos.push_historial) {
    if (!avisoBien(h)) return `El aviso enviado "${String(h.titulo || '').slice(0, 40)}" tiene datos que la app no puede usar (por ejemplo, un link sin https://). Quitalo en la pestaña Notificaciones push.`;
  }
  return '';
}

let guardando = false;
async function guardar() {
  // Si ya se está guardando (por ejemplo, al mandar un push justo después de "Guardar cambios"), espera y guarda de nuevo.
  // Si al entrar se está poniendo al día la copia de la base, espera a que termine para no pisar lo nuevo con lo viejo.
  if (sincronizando) await sincronizando;
  while (guardando) await new Promise((ok) => setTimeout(ok, 200));
  if (!datos) return false;
  // GitHub ya está al día y la vez anterior falló solo la base en línea: se reintenta solo eso.
  if (!sucio && dbPendiente) return guardarSoloDb();
  const problema = revisar();
  if (problema) { $('#estado').textContent = problema; $('#estado').className = 'estado error'; return false; }
  guardando = true;
  $('#guardar').disabled = true;
  $('#estado').className = 'estado';
  try {
    $('#estado').textContent = 'Traduciendo al inglés...';
    await completarIngles();
    $('#estado').textContent = 'Guardando...';
    datos.actualizado = new Date().toISOString().slice(0, 10);
    const guardada = version;
    const texto = JSON.stringify(datos, null, 1);
    const r = await api(`contents/${ARCHIVO}`, {
      method: 'PUT',
      body: JSON.stringify({ message: 'Panel: cambios del ' + new Date().toLocaleString('es-UY'), content: a64(texto), sha }),
    });
    if (r.status === 409) throw new Error('Alguien guardó cambios antes. Recargá la página.');
    if (r.status === 401) throw new Error('La clave de GitHub dejó de funcionar. Reemplazala en la pestaña Seguridad y volvé a guardar.');
    if (r.status === 403 || r.status === 404) throw new Error('La clave de GitHub no tiene permiso para guardar. Revisá que tenga Contents: Read and write.');
    if (!r.ok) throw new Error('No se pudo guardar (' + r.status + ').');
    sha = (await r.json()).content.sha;
    // La misma copia va a la base en línea, que la app escucha al instante.
    if (hayDb() && supa) $('#estado').textContent = 'Guardando en la base en línea...';
    const enLinea = await contenidoADb(JSON.parse(texto));
    // Lo que se escribió mientras se guardaba no entró en este guardado: queda pendiente.
    if (version !== guardada) { $('#guardar').disabled = false; $('#estado').textContent = 'Guardado, pero hay cambios nuevos sin guardar.'; $('#estado').className = 'estado'; return true; }
    sucio = false;
    mostrarGuardado(enLinea);
    return true;
  } catch (e) {
    $('#estado').textContent = e.message; $('#estado').className = 'estado error';
    $('#guardar').disabled = false;
    return false;
  } finally { guardando = false; }
}

function mostrarGuardado(enLinea) {
  const decir = (t, clase) => { $('#estado').textContent = t; $('#estado').className = 'estado ' + clase; };
  if (enLinea.estado === 'ok') decir('Guardado. La app ya lo muestra.', 'ok');
  else if (enLinea.estado === 'apagada') decir('Guardado. La app lo muestra en unos minutos.', 'ok');
  else if (enLinea.estado === 'sin-sesion') decir('Guardado en GitHub, pero no en la base en línea (mirá el aviso de arriba).', 'error');
  else { $('#guardar').disabled = false; decir('Guardado en GitHub, pero no en la base en línea: ' + enLinea.motivo + ' La app sigue mostrando lo anterior: tocá "Guardar cambios" para reintentar.', 'error'); }
}

async function guardarSoloDb() {
  guardando = true;
  $('#guardar').disabled = true;
  $('#estado').textContent = 'Guardando en la base en línea...'; $('#estado').className = 'estado';
  try { mostrarGuardado(await contenidoADb(JSON.parse(JSON.stringify(datos)))); return true; }
  finally { guardando = false; }
}

// ---------- Sesión: bloqueo por intentos y cierre por inactividad ----------
const CLAVE_INTENTOS = 'carpa_panel_intentos';
let intentosMem = { fallos: 0, hasta: 0 }, relojBloqueo = null;
const TOPE_ESPERA = 15 * 60000;
function leerIntentos() {
  try {
    const j = JSON.parse(localStorage.getItem(CLAVE_INTENTOS) || 'null');
    if (j) {
      // Si la hora de la compu se atrasó (o alguien tocó el dato), la espera nunca pasa de 15 minutos.
      const n = { fallos: +j.fallos || 0, hasta: +j.hasta || 0 }, tope = Date.now() + TOPE_ESPERA;
      if (n.hasta > tope) { n.hasta = tope; localStorage.setItem(CLAVE_INTENTOS, JSON.stringify(n)); }
      return n;
    }
  } catch (e) {}
  return intentosMem;
}
function anotarFallo() {
  const n = { ...leerIntentos() };
  n.fallos++;
  if (n.fallos >= 5) n.hasta = Date.now() + Math.min(30000 * 2 ** (n.fallos - 5), TOPE_ESPERA);
  intentosMem = n;
  try { localStorage.setItem(CLAVE_INTENTOS, JSON.stringify(n)); } catch (e) {}
}
function limpiarFallos() { intentosMem = { fallos: 0, hasta: 0 }; try { localStorage.removeItem(CLAVE_INTENTOS); } catch (e) {} }
const espera = () => Math.max(0, leerIntentos().hasta - Date.now());
const mmss = (ms) => { const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

function mostrarBloqueo(antes = '') {
  const est = $('#loginEstado'), boton = $('#entrar');
  clearInterval(relojBloqueo);
  const paso = () => {
    const ms = espera();
    if (!ms) { clearInterval(relojBloqueo); boton.disabled = false; est.textContent = 'Ya podés volver a probar.'; est.className = 'ayuda'; return; }
    boton.disabled = true;
    est.textContent = antes + 'Por seguridad, esperá ' + mmss(ms) + ' para volver a probar.'; est.className = 'ayuda error';
  };
  paso();
  relojBloqueo = setInterval(paso, 1000);
}

// ---------- Sesión recordada ("Mantener la sesión abierta en esta compu") ----------
// Las claves descifradas y la sesión de la base quedan guardadas en ESTE navegador, cifradas con una llave
// AES que el navegador guarda en IndexedDB sin dejar que nadie la lea (no exportable). Así no se pide la
// contraseña cada vez. Se borra al tocar "Salir" o después de 90 días sin entrar.
const CLAVE_RECORDADO = 'carpaPanelSesion', DIAS_RECORDADO = 90;
let recordar = false;

function baseLlaves() {
  return new Promise((ok, mal) => {
    const p = indexedDB.open('carpa-panel', 1);
    p.onupgradeneeded = () => p.result.createObjectStore('llaves');
    p.onsuccess = () => ok(p.result);
    p.onerror = () => mal(p.error);
  });
}
async function llaveRecordado(crear) {
  const base = await baseLlaves();
  const pedir = (modo, fn) => new Promise((ok, mal) => {
    const t = base.transaction('llaves', modo), r = fn(t.objectStore('llaves'));
    t.oncomplete = () => ok(r.result); t.onerror = () => mal(t.error);
  });
  try {
    let k = await pedir('readonly', (s) => s.get('sesion'));
    if (!k && crear) {
      k = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
      await pedir('readwrite', (s) => s.put(k, 'sesion'));
    }
    return k || null;
  } finally { base.close(); }
}
async function guardarRecordado() {
  if (!recordar || !secretos) return;
  try {
    const k = await llaveRecordado(true), iv = crypto.getRandomValues(new Uint8Array(12));
    const texto = JSON.stringify({ secretos, refresh: supa ? supa.refresh : null, hasta: Date.now() + DIAS_RECORDADO * 864e5 });
    const c = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, k, new TextEncoder().encode(texto));
    if (recordar) localStorage.setItem(CLAVE_RECORDADO, JSON.stringify({ iv: b64(iv), datos: b64(new Uint8Array(c)) }));
  } catch (e) {}
}
async function leerRecordado() {
  try {
    const j = JSON.parse(localStorage.getItem(CLAVE_RECORDADO) || 'null');
    if (!j || typeof j.iv !== 'string' || typeof j.datos !== 'string') return null;
    const k = await llaveRecordado(false);
    if (!k) return null;
    const t = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: deb64(j.iv) }, k, deb64(j.datos));
    const s = JSON.parse(new TextDecoder().decode(t));
    if (!s || !s.secretos || typeof s.secretos.github !== 'string' || !(s.hasta > Date.now())) return null;
    return s;
  } catch (e) { return null; }
}
async function olvidarRecordado() {
  recordar = false;
  try { localStorage.removeItem(CLAVE_RECORDADO); } catch (e) {}
  try {
    const base = await baseLlaves();
    await new Promise((ok) => { const t = base.transaction('llaves', 'readwrite'); t.objectStore('llaves').delete('sesion'); t.oncomplete = t.onerror = () => ok(); });
    base.close();
  } catch (e) {}
}
// Al abrir la página: si hay una sesión recordada, entra sola.
async function entrarRecordado() {
  const s = await leerRecordado();
  if (!s) { if (localStorage.getItem(CLAVE_RECORDADO)) await olvidarRecordado(); return; }
  const est = $('#loginEstado'), boton = $('#entrar');
  recordar = true; $('#recordarme').checked = true;
  entrando = true; boton.disabled = true; est.textContent = 'Entrando...'; est.className = 'ayuda';
  secretos = { github: s.secretos.github, firebase: s.secretos.firebase && typeof s.secretos.firebase === 'object' ? s.secretos.firebase : null };
  formatoViejo = false; passCorta = false;
  try { await abrirPanel(null, s.refresh); }
  catch (e) {
    secretos = null;
    await olvidarRecordado();
    est.textContent = e.vencida ? 'La clave de GitHub dejó de funcionar: entrá con tu contraseña.' : e.message + ' Entrá con tu contraseña.';
    est.className = 'ayuda error';
  } finally { entrando = false; boton.disabled = false; }
}

const INACTIVIDAD = 20 * 60000, AVISO_ANTES = 2 * 60000;
let ultimaActividad = Date.now(), relojSesion = null;
function actividad() {
  // Con la sesión recordada no se cierra por inactividad (se cierra con "Salir").
  if (!secretos || recordar) return;
  if (Date.now() - ultimaActividad >= INACTIVIDAD) { cerrarSesion(); return; }
  ultimaActividad = Date.now();
  $('#avisoSesion').classList.add('oculto');
}
function vigilarSesion() {
  ultimaActividad = Date.now();
  clearInterval(relojSesion);
  relojSesion = setInterval(() => {
    if (!secretos) return;
    const resto = INACTIVIDAD - (Date.now() - ultimaActividad), aviso = $('#avisoSesion');
    if (resto <= 0) { cerrarSesion(); return; }
    if (resto > AVISO_ANTES) return;
    aviso.textContent = `Por seguridad, el panel se cierra en ${mmss(resto)} por falta de actividad.` + (sucio ? ' Tenés cambios sin guardar: guardalos o tocá cualquier lado para seguir.' : ' Tocá cualquier lado para seguir.');
    aviso.classList.remove('oculto');
  }, 1000);
}
function cerrarSesion() {
  if (sucio && datos) pendiente = { datos, sha };
  secretos = null; accesoFcm = null; datos = null; sha = null; sucio = false; formatoViejo = false;
  pararMuro(); salirDb(); muro = muroVacio(); camp = campVacio(); reg = regVacio(); avisosDb = avisosVacio(); pintarAvisoDb();
  clearInterval(relojSesion);
  $('#avisoSesion').classList.add('oculto'); $('#modal').style.display = 'none'; alListo = null;
  $('#panel').classList.add('oculto'); $('#barra').classList.add('oculto'); $('#salir').classList.add('oculto');
  $('#vista').replaceChildren();
  $('#guardar').disabled = true; $('#estado').textContent = 'Sin cambios'; $('#estado').className = 'estado';
  cancelarPrimera();
  $('#pass').value = '';
  $('#login').classList.remove('oculto');
  $('#loginEstado').textContent = 'Se cerró la sesión después de 20 minutos sin actividad.' + (pendiente ? ' Tus cambios sin guardar siguen en esta pestaña: entrá de nuevo y guardalos.' : '');
  $('#loginEstado').className = 'ayuda';
}

async function abrirPanel(pass, refresh = null) {
  // GitHub y la base en línea a la vez. Si la base falla, el panel abre igual y avisa qué falta.
  muro = muroVacio(); camp = campVacio(); reg = regVacio(); avisosDb = avisosVacio();
  try { await Promise.all([cargar(), entrarDb(pass, refresh)]); } catch (e) { salirDb(); throw e; }
  if (supa) {
    migracion = migrarAvisos();
    const s = sincronizarContenido();
    sincronizando = s;
    s.finally(() => { if (sincronizando === s) sincronizando = null; });
  }
  pintarAvisoDb();
  let recuperado = false;
  if (pendiente) { if (pendiente.sha === sha) { datos = pendiente.datos; recuperado = true; } pendiente = null; }
  cancelarPrimera();
  $('#pass').value = '';
  $('#login').classList.add('oculto');
  $('#panel').classList.remove('oculto'); $('#barra').classList.remove('oculto'); $('#salir').classList.remove('oculto');
  $('#loginEstado').textContent = '';
  if (recordar) { clearInterval(relojSesion); guardarRecordado(); }
  else { await olvidarRecordado(); vigilarSesion(); }
  pintarTabs(); pintar();
  repararTraducciones();
  if (recuperado) { cambio(); $('#estado').textContent = 'Recuperamos tus cambios sin guardar. Tocá "Guardar cambios".'; }
}

// ---------- Entrar ----------
let modoPrimera = 'nueva', guardadosVencida = null, entrando = false, guardandoPrimera = false, passCorta = false;

async function entrar() {
  const est = $('#loginEstado'), boton = $('#entrar');
  // Con Enter se puede llamar varias veces seguidas: un solo intento por vez, así el bloqueo no se saltea.
  if (entrando) return;
  if (espera()) { mostrarBloqueo(); return; }
  const pass = $('#pass').value;
  if (!pass) { est.textContent = 'Escribí la contraseña.'; est.className = 'ayuda error'; return; }
  entrando = true;
  boton.disabled = true; est.textContent = 'Entrando...'; est.className = 'ayuda';
  try {
    const cifrada = await leerClaveCifrada();
    if (!cifrada) { est.textContent = ''; mostrarPrimeraVez('nueva'); return; }
    let abierto;
    try { abierto = await abrirSecretos(cifrada, pass); } catch (e) {
      anotarFallo();
      if (espera()) { mostrarBloqueo('Contraseña incorrecta. '); return; }
      throw new Error('Contraseña incorrecta.');
    }
    limpiarFallos();
    secretos = abierto.secretos; formatoViejo = abierto.viejo; passCorta = pass.length < 10;
    recordar = $('#recordarme').checked;
    try { await abrirPanel(pass); } catch (e) {
      secretos = null;
      if (!e.vencida) throw e;
      guardadosVencida = abierto.secretos;
      est.textContent = '';
      mostrarPrimeraVez('vencida');
    }
  } catch (e) {
    secretos = null;
    est.textContent = e.message; est.className = 'ayuda error';
  } finally { entrando = false; if (!espera()) boton.disabled = false; }
}

function mostrarPrimeraVez(modo) {
  modoPrimera = modo;
  $('#primeraTitulo').textContent = modo === 'nueva' ? 'Configurar el panel (una sola vez)' : 'La clave de GitHub dejó de funcionar';
  $('#primeraAyuda').textContent = modo === 'nueva'
    ? 'Todavía no hay nada configurado. El panel guarda los cambios en GitHub con una clave que solo puede tocar este repositorio. La pegás acá una vez y queda guardada cifrada con la contraseña que escribiste arriba. Después se entra solo con la contraseña.'
    : 'La contraseña está bien, pero la clave de GitHub venció o la borraron. Creá una nueva y pegala acá: se guarda cifrada con la misma contraseña.';
  $('#pasosToken').replaceChildren(pasosToken());
  $('#cajaPass2').classList.toggle('oculto', modo !== 'nueva');
  $('#pass').readOnly = modo === 'vencida';
  $('#entrar').classList.add('oculto');
  $('#primeraVez').classList.remove('oculto');
  $('#token').focus();
}

function cancelarPrimera() {
  guardadosVencida = null;
  $('#primeraVez').classList.add('oculto'); $('#entrar').classList.remove('oculto');
  $('#pass').readOnly = false;
  $('#token').value = ''; $('#pass2').value = ''; $('#primeraEstado').textContent = '';
}

async function guardarPrimera() {
  if (guardandoPrimera) return;
  const est = $('#primeraEstado'), boton = $('#guardarPrimera'), token = $('#token').value.trim(), pass = $('#pass').value;
  est.className = 'ayuda';
  guardandoPrimera = true;
  boton.disabled = true;
  try {
    if (modoPrimera === 'nueva') {
      if (pass.length < 10) throw new Error('La contraseña tiene que tener al menos 10 caracteres. Cambiala arriba.');
      if ($('#pass2').value !== pass) throw new Error('Las dos contraseñas no coinciden.');
    } else if (!guardadosVencida) throw new Error('Volvé a escribir la contraseña y tocá Entrar.');
    validarToken(token);
    est.textContent = 'Probando la clave...';
    await probarToken(token);
    const vieja = await leerClaveCifrada();
    if (modoPrimera === 'nueva' && vieja) throw new Error('Ya hay una configuración guardada. Recargá la página y entrá con tu contraseña.');
    const nuevos = { github: token, firebase: modoPrimera === 'vencida' ? guardadosVencida.firebase : null };
    est.textContent = 'Guardando cifrado...';
    await escribirClave(nuevos, pass, vieja && vieja.sha);
    secretos = nuevos; formatoViejo = false; passCorta = pass.length < 10;
    recordar = $('#recordarme').checked;
    est.textContent = '';
    await abrirPanel(pass);
  } catch (e) {
    if (!$('#panel').classList.contains('oculto')) return;
    secretos = null;
    est.textContent = e.message; est.className = 'ayuda error';
  } finally { guardandoPrimera = false; boton.disabled = false; }
}

let saliendo = false;
async function salir() {
  if (saliendo) return;
  if (sucio && !confirm('Hay cambios sin guardar. ¿Salir igual?')) return;
  if (dbPendiente && !confirm('Lo último que está guardado no llegó a la base en línea y la app sigue mostrando lo anterior. ¿Salir igual?')) return;
  saliendo = true;
  $('#salir').disabled = true;
  pararMuro();
  const cierre = salirDb();
  secretos = null; accesoFcm = null; guardadosVencida = null; datos = null; sucio = false; pendiente = null;
  try { sessionStorage.removeItem('clave'); } catch (e) {}
  await olvidarRecordado();
  // Espera (como mucho 3 segundos) a que Supabase cierre la sesión antes de recargar la página.
  await Promise.race([cierre, new Promise((ok) => setTimeout(ok, 3000))]);
  location.reload();
}

(function inicio() {
  // Versiones anteriores del panel guardaban la clave en el navegador: se borra.
  try { sessionStorage.removeItem('clave'); localStorage.removeItem('clave'); } catch (e) {}
  // GitHub Pages no deja prohibir que otra página meta el panel adentro (iframe) para engañar los clics: en ese caso no arranca.
  let enMarco = true;
  try { enMarco = window.top !== window.self; } catch (e) {}
  if (enMarco) {
    $('#login').replaceChildren(el('h2', { text: 'Abrí el panel directamente' }), el('p', { class: 'ayuda', text: 'Por seguridad, el panel no funciona dentro de otra página. Entrá escribiendo la dirección en el navegador.' }));
    return;
  }
  const enter = (fn) => (e) => { if (e.key === 'Enter') fn(); };
  $('#entrar').addEventListener('click', entrar);
  $('#pass').addEventListener('keydown', enter(() => ($('#primeraVez').classList.contains('oculto') ? entrar() : guardarPrimera())));
  $('#token').addEventListener('keydown', enter(guardarPrimera));
  $('#pass2').addEventListener('keydown', enter(guardarPrimera));
  $('#guardarPrimera').addEventListener('click', guardarPrimera);
  $('#cancelarPrimera').addEventListener('click', cancelarPrimera);
  $('#guardar').addEventListener('click', guardar);
  $('#salir').addEventListener('click', salir);
  ['pointerdown', 'keydown', 'mousemove', 'wheel', 'touchstart', 'scroll'].forEach((ev) => window.addEventListener(ev, actividad, { passive: true, capture: true }));
  window.addEventListener('beforeunload', (e) => { if (sucio || pendiente || dbPendiente) { e.preventDefault(); e.returnValue = ''; } });
  if (espera()) mostrarBloqueo();
  $('#pass').focus();
  entrarRecordado();
})();
</script>
