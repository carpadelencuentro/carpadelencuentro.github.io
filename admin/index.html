<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com https://fonts.googleapis.com; font-src https://fonts.gstatic.com 'self'; img-src 'self' data: blob: https:; connect-src https://api.github.com https://translate.googleapis.com https://oauth2.googleapis.com https://fcm.googleapis.com https://raw.githubusercontent.com; base-uri 'none'; form-action 'none'; object-src 'none'">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root { --azul:#0251B8; --azul2:#1F3FA8; --tinta:#141A33; --gris:#5A5F75; --linea:#E3E6EC; --suave:#F4F5F8; --rojo:#B3221A; --verde:#1B6E45; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Figtree',system-ui,sans-serif; color:var(--tinta); background:#fff; }
  header { background:var(--azul); color:#fff; display:flex; align-items:center; gap:12px; padding:12px 16px; position:sticky; top:0; z-index:500; }
  header img { width:44px; height:44px; border-radius:10px; }
  header h1 { font-size:19px; margin:0; font-weight:800; }
  header small { display:block; font-weight:600; opacity:.85; font-size:13px; }
  header button { margin-left:auto; background:transparent; border:1px solid rgba(255,255,255,.6); color:#fff; border-radius:999px; padding:8px 14px; font:inherit; font-weight:700; cursor:pointer; }
  main { max-width:860px; margin:0 auto; padding:16px 16px 120px; }
  .tabs { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:14px; }
  .tabs button { flex:none; height:40px; padding:0 16px; border-radius:999px; border:1px solid var(--linea); background:#fff; font:inherit; font-weight:700; color:#3F4560; cursor:pointer; }
  .tabs button.on { background:var(--tinta); color:#fff; border-color:var(--tinta); }
  .card { border:1px solid var(--linea); border-radius:16px; padding:16px; margin-bottom:12px; background:#fff; }
  .card.suave { background:var(--suave); border-color:transparent; }
  .card.alerta { background:#FFF8E1; border-color:#F0D98A; }
  h2 { font-size:22px; margin:6px 0 4px; }
  h3 { font-size:17px; margin:2px 0 6px; }
  p.ayuda, ol.ayuda { color:var(--gris); margin:0 0 14px; line-height:1.45; }
  ol.ayuda li { margin-bottom:4px; }
  label { display:block; font-weight:700; font-size:14px; margin:10px 0 6px; }
  input, textarea, select { width:100%; font:inherit; font-size:16px; padding:11px 12px; border:1.5px solid #D5D9E2; border-radius:12px; background:#fff; color:var(--tinta); }
  input[type=file] { padding:9px; }
  textarea { min-height:80px; resize:vertical; }
  input:focus, textarea:focus, select:focus { outline:none; border-color:var(--azul2); }
  input[readonly] { background:var(--suave); }
  .fila { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  @media (max-width:560px) { .fila { grid-template-columns:1fr; } }
  .btn { height:44px; padding:0 16px; border-radius:12px; border:0; background:var(--azul2); color:#fff; font:inherit; font-weight:800; cursor:pointer; }
  .btn.sec { background:#fff; color:var(--azul2); border:1px solid #C8D3F5; }
  .btn.peligro { background:#fff; color:var(--rojo); border:1px solid #F3C4C0; }
  .btn.chico { height:34px; padding:0 10px; font-size:13px; border-radius:10px; }
  .btn:disabled { background:#E3E6EC; color:#4A4E60; cursor:not-allowed; }
  .acciones { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
  .item-cab { display:flex; align-items:center; gap:10px; cursor:pointer; }
  .item-cab img { width:52px; height:52px; border-radius:10px; object-fit:cover; background:var(--suave); }
  .item-cab b { display:block; font-size:16px; }
  .item-cab span { color:var(--gris); font-size:14px; }
  .item-cab .chev { margin-left:auto; color:#8A90A6; font-size:20px; }
  .detalle { margin-top:10px; border-top:1px solid var(--linea); padding-top:6px; }
  .barra { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--linea); padding:12px 16px; display:flex; align-items:center; gap:12px; z-index:600; }
  .barra .estado { color:var(--gris); font-weight:600; font-size:14px; flex:1; }
  .barra .btn { min-width:180px; height:50px; font-size:17px; }
  .ok { color:var(--verde) !important; } .error { color:var(--rojo) !important; }
  .chip { display:inline-block; padding:3px 10px; border-radius:999px; background:#E9EEFB; color:var(--azul2); font-weight:700; font-size:12px; }
  .chip.aprox { background:#FFF4CF; color:#7A5B00; }
  #modal { position:fixed; inset:0; background:rgba(11,22,56,.55); display:none; align-items:center; justify-content:center; z-index:1000; padding:16px; }
  #modal .caja { background:#fff; border-radius:18px; width:min(720px,100%); padding:14px; }
  #mapa { height:420px; border-radius:12px; }
  .oculto { display:none !important; }
  #dialogo { position:fixed; inset:0; background:rgba(11,22,56,.55); display:flex; align-items:center; justify-content:center; z-index:1001; padding:16px; }
  #dialogo .caja { background:#fff; border-radius:18px; width:min(560px,100%); max-height:calc(100vh - 32px); overflow:auto; padding:20px; box-shadow:0 20px 60px rgba(0,0,0,.3); }
  .en-label { display:block; margin:10px 0 6px; font-size:13px; font-weight:700; color:var(--azul2); }
  input.en, textarea.en { background:#EEF4FF; border-color:#C9DAF8; }
  .contador { float:right; font-weight:600; font-size:13px; color:var(--gris); }
  .mini { width:72px; height:72px; border-radius:12px; object-fit:cover; background:var(--suave); border:1px solid var(--linea); display:block; }
  .foto-fila { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .galeria { display:flex; gap:12px; flex-wrap:wrap; }
  .foto-item { display:flex; flex-direction:column; gap:6px; align-items:flex-start; width:124px; }
  .foto-item img { width:124px; height:92px; object-fit:cover; border-radius:10px; background:var(--suave); }
  .link-fila { display:flex; gap:8px; }
  .link-fila input { flex:1; min-width:0; }
  .link-fila .btn { flex:none; }
  .celus { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin:14px 0 4px; }
  @media (max-width:560px) { .celus { grid-template-columns:1fr; } }
  .cel { background:linear-gradient(160deg,#1F3FA8,#0B1638); border-radius:24px; padding:12px 10px 22px; }
  .cel-hora { color:#fff; text-align:center; font-weight:700; font-size:13px; opacity:.85; margin-bottom:12px; }
  .noti { background:rgba(255,255,255,.95); border-radius:16px; padding:10px 12px; display:flex; gap:10px; }
  .noti img { width:36px; height:36px; border-radius:9px; flex:none; }
  .noti-app { font-size:12px; color:var(--gris); }
  .noti b { display:block; font-size:14px; overflow-wrap:anywhere; }
  .noti p { margin:2px 0 0; font-size:13px; color:#2B3045; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
  .noti .vacio { color:#9AA0B4; }
  .cel-nombre { text-align:center; font-weight:700; font-size:13px; color:var(--gris); margin-top:6px; }
  .aviso { position:fixed; left:16px; right:16px; bottom:86px; max-width:620px; margin:0 auto; background:#FFF4CF; color:#5C4400; border:1px solid #F0D98A; border-radius:14px; padding:12px 14px; font-weight:700; z-index:700; }
</style>
</head>
<body>
<header>
  <img src="../logo.jpg" alt="">
  <div><h1>Panel de la app</h1><small>Carpa del Encuentro</small></div>
  <button id="salir" class="oculto" type="button">Salir</button>
</header>

<main>
  <section id="login" class="card suave">
    <h2>Entrar al panel</h2>
    <label for="pass">Contraseña de administrador</label>
    <input id="pass" type="password" autocomplete="current-password" maxlength="200">
    <div class="acciones"><button class="btn" id="entrar" type="button">Entrar</button></div>
    <p id="loginEstado" class="ayuda" style="margin-top:10px" aria-live="polite"></p>

    <div id="primeraVez" class="oculto">
      <h3 id="primeraTitulo"></h3>
      <p class="ayuda" id="primeraAyuda"></p>
      <div id="pasosToken"></div>
      <label for="token">Clave de GitHub</label>
      <input id="token" type="password" autocomplete="off" maxlength="255" placeholder="github_pat_...">
      <div id="cajaPass2"><label for="pass2">Repetí la contraseña</label><input id="pass2" type="password" autocomplete="new-password" maxlength="200"></div>
      <div class="acciones">
        <button class="btn" id="guardarPrimera" type="button">Guardar y entrar</button>
        <button class="btn sec" id="cancelarPrimera" type="button">Cancelar</button>

      <p id="primeraEstado" class="ayuda" style="margin-top:10px" aria-live="polite"></p>

  <section id="panel" class="oculto">
    <nav class="tabs" id="tabs"></nav>

</main>

<div class="aviso oculto" id="avisoSesion" role="status"></div>

<div class="barra oculto" id="barra">
  <span class="estado" id="estado">Sin cambios</span>
  <button class="btn" id="guardar" type="button" disabled>Guardar cambios</button>
</div>

<div id="dialogo" class="oculto"><div class="caja"></div></div>

<div id="modal">
  <div class="caja">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px">
      <b style="font-size:17px">Arrastrá el punto hasta la puerta de la iglesia</b>
      <button class="btn sec" id="cerrarMapa" type="button" style="margin-left:auto">Listo</button>
    </div>
    <div id="mapa"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const $ = (s) => document.querySelector(s);
const ARCHIVO = 'contenido.json';
const DUENO = 'carpadelencuentro';
const REPO = 'carpadelencuentro.github.io';
let datos = null, sha = null, sucio = false, tab = 'novedades';
// Claves descifradas (GitHub y Firebase): viven solo en esta variable, nunca en el navegador.
let secretos = null, formatoViejo = false, pendiente = null;

function el(tag, attrs = {}, ...hijos) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'on') for (const [ev, fn] of Object.entries(v)) e.addEventListener(ev, fn);
    else if (k === 'text') e.textContent = v;
    else if (k === 'value') e.value = v ?? '';
    else e.setAttribute(k, v);
  }
  for (const h of hijos.flat()) if (h != null) e.append(h);
  return e;
}

let version = 0;
function cambio() { sucio = true; version++; $('#guardar').disabled = false; $('#estado').textContent = 'Hay cambios sin guardar'; $('#estado').className = 'estado'; }

const esHttps = (u) => { try { const x = new URL(String(u)); return x.protocol === 'https:' && !!x.hostname; } catch (e) { return false; } };
const MAX_LINEA = 200, MAX_TEXTO = 3000;
const nuevoId = () => 'c' + Math.random().toString(36).slice(2);

function campo(etiqueta, obj, clave, opts = {}) {
  const id = nuevoId();
  const input = opts.multilinea ? el('textarea', { id, value: obj[clave] ?? '' }) : el('input', { id, value: obj[clave] ?? '', type: opts.tipo || 'text' });
  if (opts.placeholder) input.placeholder = opts.placeholder;
  if (opts.multilinea || !opts.tipo || opts.tipo === 'text') input.maxLength = opts.max || (opts.multilinea ? MAX_TEXTO : MAX_LINEA);
  const aviso = el('p', { class: 'ayuda error oculto', style: 'margin:6px 0 0' });
  const revisarLink = () => {
    const u = input.value.trim(), malo = !!(opts.https && u && !esHttps(u));
    aviso.textContent = malo ? 'Tiene que ser un link que empiece con https://' : '';
    aviso.classList.toggle('oculto', !malo);
  };
  input.addEventListener('input', () => { obj[clave] = opts.numero ? parseFloat(input.value) : input.value; revisarLink(); if (opts.alCambiar) opts.alCambiar(); cambio(); });
  revisarLink();
  return el('div', {}, el('label', { for: id, text: etiqueta }), input, aviso, opts.ayuda ? el('p', { class: 'ayuda', text: opts.ayuda, style: 'margin:6px 0 0' }) : null);
}

// Inglés: la app se ve en inglés en los celulares que no están en español.
// Cada texto se traduce solo y se puede corregir a mano; se guarda en datos.en.
async function traducir(t) {
  const r = await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=es&tl=en&dt=t&q=' + encodeURIComponent(t));
  if (!r.ok) throw new Error('traductor');
  return (await r.json())[0].map((p) => p[0]).join('');
}

function textosATraducir() {
  const xs = [];
  const add = (t) => { if (t && String(t).trim()) xs.push(String(t)); };
  datos.noticias.forEach((n) => { add(n.titulo); add(n.texto); });
  ['proximo_titulo', 'proximo_fecha', 'proximo_lugar'].forEach((k) => add(datos.config[k]));
  datos.iglesias.forEach((c) => { add(c.nombre); add(c.reuniones); });
  return [...new Set(xs)];
}

async function completarIngles() {
  datos.en = datos.en || {};
  const usados = textosATraducir();
  for (const t of usados) if (!datos.en[t]) { try { datos.en[t] = await traducir(t); } catch (e) {} }
  const limpio = {};
  usados.forEach((t) => { if (datos.en[t]) limpio[t] = datos.en[t]; });
  datos.en = limpio;
}

// Campo en español + su vista previa en inglés debajo.
function campoEn(etiqueta, obj, clave, opts = {}) {
  datos.en = datos.en || {};
  const lineas = () => String(obj[clave] ?? '').split('\n').map((x) => x.trim()).filter(Boolean);
  const valorEn = () => opts.lineas ? lineas().map((l) => datos.en[l] || '').join('\n') : (datos.en[obj[clave]] || '');
  const id = 'e' + Math.random().toString(36).slice(2);
  const en = opts.multilinea ? el('textarea', { id, class: 'en' }) : el('input', { id, class: 'en' });
  en.maxLength = opts.multilinea ? MAX_TEXTO : MAX_LINEA * 2;
  en.value = valorEn();
  en.placeholder = 'Se traduce solo cuando escribís en español';
  en.addEventListener('input', () => {
    if (opts.lineas) { const es = lineas(), xs = en.value.split('\n'); es.forEach((l, i) => { if (xs[i] != null) datos.en[l] = xs[i].trim(); }); }
    else if (obj[clave]) datos.en[obj[clave]] = en.value;
    cambio();
  });
  let timer = null;
  const programar = () => {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      const faltan = (opts.lineas ? lineas() : [String(obj[clave] ?? '')]).filter((t) => t.trim() && !datos.en[t]);
      if (faltan.length) en.placeholder = 'Traduciendo...';
      try { for (const t of faltan) datos.en[t] = await traducir(t); } catch (e) { en.placeholder = 'No se pudo traducir: escribilo a mano'; }
      en.value = valorEn();
    }, 700);
  };
  const caja = campo(etiqueta, obj, clave, { ...opts, alCambiar: () => { if (opts.alCambiar) opts.alCambiar(); programar(); } });
  caja.append(el('label', { for: id, class: 'en-label', text: 'En inglés (vista previa, la podés corregir)' }), en);
  return caja;
}

// Ventana para agregar: lo nuevo se suma a la lista recién al tocar "Agregar".
function abrirDialogo(titulo, campos, alAgregar) {
  const fondo = $('#dialogo'), caja = $('#dialogo .caja');
  const error = el('p', { class: 'ayuda error' });
  const inputs = {};
  const filas = campos.map((c) => {
    const id = 'd' + Math.random().toString(36).slice(2);
    let input;
    if (c.opciones) input = el('select', { id }, ...c.opciones.map(([v, t]) => el('option', { value: v, text: t })));
    else if (c.multilinea) input = el('textarea', { id });
    else input = el('input', { id, type: c.tipo || 'text' });
    if (c.valor != null) input.value = c.valor;
    if (c.placeholder) input.placeholder = c.placeholder;
    if (c.max) input.maxLength = c.max;
    inputs[c.clave] = input;
    return { c, fila: el('div', { style: 'margin-bottom:12px' }, el('label', { for: id, text: c.etiqueta }), input, c.ayuda ? el('p', { class: 'ayuda', text: c.ayuda, style: 'margin:6px 0 0' }) : null) };
  });
  const mostrarSegun = () => filas.forEach(({ c, fila }) => { if (c.visibleSi) fila.classList.toggle('oculto', !c.visibleSi(inputs)); });
  Object.values(inputs).forEach((i) => i.addEventListener('change', mostrarSegun));
  const cerrar = () => { fondo.classList.add('oculto'); caja.replaceChildren(); document.removeEventListener('keydown', esc); };
  const esc = (e) => { if (e.key === 'Escape') cerrar(); };
  const agregar = () => {
    const v = {};
    for (const [k, i] of Object.entries(inputs)) v[k] = i.value.trim();
    const problema = alAgregar(v);
    if (problema) { error.textContent = problema; return; }
    cerrar();
  };
  caja.replaceChildren(
    el('h2', { text: titulo, style: 'margin-top:0' }),
    ...filas.map((f) => f.fila), error,
    el('div', { class: 'acciones' },
      el('button', { class: 'btn', type: 'button', text: 'Agregar', on: { click: agregar } }),
      el('button', { class: 'btn sec', type: 'button', text: 'Cancelar', on: { click: cerrar } })));
  mostrarSegun();
  fondo.classList.remove('oculto');
  document.addEventListener('keydown', esc);
  const primero = caja.querySelector('input, textarea, select');
  if (primero) primero.focus();
}

async function traducirNuevos(textos) {
  for (const t of textos) if (t && !datos.en[t]) { try { datos.en[t] = await traducir(t); } catch (e) {} }
  if (!$('#dialogo').classList.contains('oculto')) return;
  pintar();
}

function nuevaNovedad() {
  abrirDialogo('Nueva novedad', [
    { clave: 'titulo', etiqueta: 'Título', max: 80 },
    { clave: 'texto', etiqueta: 'Texto', multilinea: true, max: 400 },
    { clave: 'fecha', etiqueta: 'Fecha', tipo: 'date', valor: new Date().toISOString().slice(0, 10) },
    { clave: 'tipo', etiqueta: 'Al tocarla', opciones: [['nada', 'Nada (solo texto)'], ['video', 'Abrir un video de YouTube'], ['predicas', 'Ir a Prédicas'], ['encuentros', 'Ir a Encuentros']] },
    { clave: 'video', etiqueta: 'Link del video', placeholder: 'https://youtu.be/...', visibleSi: (i) => i.tipo.value === 'video' },
  ], (v) => {
    if (!v.titulo) return 'Escribí el título.';
    const n = { titulo: v.titulo, texto: v.texto, fecha: /^\d{4}-\d{2}-\d{2}$/.test(v.fecha) ? v.fecha : new Date().toISOString().slice(0, 10) };
    if (v.tipo === 'video') {
      const id = idVideo(v.video);
      if (!id) return 'Pegá un link de YouTube que funcione.';
      n.video = id;
    } else if (v.tipo === 'predicas' || v.tipo === 'encuentros') n.accion = v.tipo;
    datos.noticias.unshift(n);
    cambio(); pintar();
    traducirNuevos([n.titulo, n.texto]);
  });
}

function nuevaIglesia() {
  abrirDialogo('Nueva iglesia', [
    { clave: 'ciudad', etiqueta: 'Ciudad o barrio', max: 60 },
    { clave: 'nombre', etiqueta: 'Nombre de la iglesia', valor: 'Iglesia Cristiana Evangélica', max: 90 },
    { clave: 'direccion', etiqueta: 'Dirección', placeholder: 'Calle 1234 - Ciudad', max: 120 },
    { clave: 'tels', etiqueta: 'Teléfonos (separados por coma)', ayuda: 'Los celulares que empiezan con 09 tienen botón de WhatsApp.', max: 120 },
    { clave: 'reuniones', etiqueta: 'Reuniones', multilinea: true, placeholder: 'Domingo\n10:00 hs. Culto', max: 800 },
  ], (v) => {
    if (!v.ciudad) return 'Escribí la ciudad o el barrio.';
    const slug = v.ciudad.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'iglesia';
    const c = { id: `${slug}-${Date.now().toString(36)}`, ciudad: v.ciudad, nombre: v.nombre, direccion: v.direccion, telefonos: telefonos(v.tels), reuniones: v.reuniones, fotos: [], lat: -34.88, lng: -56.17, aprox: true };
    datos.iglesias.unshift(c);
    abiertas = new Set([0]); filtro = '';
    cambio(); pintar();
    $('#estado').textContent = 'Iglesia agregada: ubicala en el mapa, subí una foto y tocá Guardar cambios';
    traducirNuevos([c.nombre, c.reuniones]);
  });
}

function telefonos(texto) {
  return texto.split(/[,;/]|\s-\s/).map((p) => p.replace(/\D/g, '')).filter(Boolean).map((d) => {
    if (d.length === 9 && d.startsWith('09')) return { num: `${d.slice(0, 3)} ${d.slice(3, 6)} ${d.slice(6)}`, wa: '598' + d.slice(1), tel: '+598' + d.slice(1) };
    if (d.length === 8 && /^[24]/.test(d)) return { num: `${d.slice(0, 4)} ${d.slice(4)}`, wa: null, tel: '+598' + d };
    return { num: d, wa: null, tel: '+' + d };
  });
}

async function achicarFoto(archivo) {
  let img;
  try { img = await createImageBitmap(archivo, { imageOrientation: 'from-image' }); }
  catch (e) {
    img = await new Promise((ok, mal) => {
      const i = new Image(), u = URL.createObjectURL(archivo);
      i.onload = () => { URL.revokeObjectURL(u); ok(i); };
      i.onerror = () => { URL.revokeObjectURL(u); mal(new Error('No pude abrir esa imagen. Probá con otra.')); };
      i.src = u;
    });
  }
  const w0 = img.naturalWidth || img.width, h0 = img.naturalHeight || img.height;
  if (!w0 || !h0) throw new Error('No pude abrir esa imagen. Probá con otra.');
  const k = Math.min(1, 1280 / Math.max(w0, h0));
  const w = Math.max(1, Math.round(w0 * k)), h = Math.max(1, Math.round(h0 * k));
  const lienzo = document.createElement('canvas');
  lienzo.width = w; lienzo.height = h;
  const g = lienzo.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
  g.imageSmoothingQuality = 'high';
  g.drawImage(img, 0, 0, w, h);
  if (img.close) img.close();
  return new Promise((ok, mal) => lienzo.toBlob((b) => (b ? ok(b) : mal(new Error('No pude convertir la foto.'))), 'image/jpeg', 0.85));
}

const blobABase64 = (b) => new Promise((ok, mal) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = () => mal(new Error('No pude leer la foto.')); r.readAsDataURL(b); });

async function nombreLibre(base) {
  const r = await api('contents/fotos');
  const lista = r.ok ? await r.json() : [];
  const usados = new Set(Array.isArray(lista) ? lista.map((f) => f.name) : []);
  let n = 1;
  while (usados.has(`${base}-${n}.jpg`)) n++;
  return `${base}-${n}.jpg`;
}

async function subirFoto(archivo, base, decir) {
  if (!TIPOS_FOTO.includes(archivo.type)) throw new Error('Elegí una foto JPG, PNG o WEBP.');
  if (archivo.size > 15 * 1024 * 1024) throw new Error('La foto pesa más de 15 MB. Elegí una más liviana.');
  decir('Preparando la foto...');
  const jpg = await achicarFoto(archivo);
  const previa = URL.createObjectURL(jpg);
  const contenido = await blobABase64(jpg);
  decir('Subiendo...');
  let nombre = await nombreLibre(base);
  for (let intento = 0; intento < 3; intento++) {
    const r = await api('contents/fotos/' + nombre, { method: 'PUT', body: JSON.stringify({ message: 'Panel: foto ' + nombre, content: contenido }) });
    if (r.ok) {
      const url = `https://raw.githubusercontent.com/${DUENO}/${REPO}/main/fotos/${nombre}`;
      vistasPrevias.set(url, previa);
      return url;
    }
    if (r.status !== 422) throw new Error('No se pudo subir la foto (' + r.status + ').');
    nombre = nombre.replace(/-(\d+)\.jpg$/, (_, n) => `-${+n + 1}.jpg`);
  }
  throw new Error('No se pudo subir la foto. Probá de nuevo.');
}

async function enviarPush(boton, estado) {
  const p = { titulo: push.titulo.trim(), texto: push.texto.trim(), titulo_en: push.titulo_en.trim(), texto_en: push.texto_en.trim(), accion: push.accion, link: push.accion === 'link' ? push.link.trim() : '' };
  const error = (t) => { estado.textContent = t; estado.className = 'ayuda error'; };
  if (!p.titulo || !p.texto) return error('Escribí el título y el mensaje.');
  if (!p.titulo_en || !p.texto_en) return error('Falta el texto en inglés. Esperá a que se traduzca o escribilo a mano.');
  if (p.titulo.length > MAX_TITULO_PUSH || p.titulo_en.length > MAX_TITULO_PUSH) return error(`El título puede tener hasta ${MAX_TITULO_PUSH} letras (fijate también el de inglés).`);
  if (p.texto.length > MAX_TEXTO_PUSH || p.texto_en.length > MAX_TEXTO_PUSH) return error(`El mensaje puede tener hasta ${MAX_TEXTO_PUSH} letras (fijate también el de inglés).`);
  if (!ACCIONES_PUSH.some(([a]) => a === p.accion)) return error('Elegí qué abre la notificación.');
  if (p.accion === 'link' && !esHttps(p.link)) return error('El link tiene que empezar con https://');
  if (!secretos || !secretos.firebase) return error('Falta conectar Firebase en la pestaña Seguridad.');
  const extra = sucio ? '\n\nOjo: también se van a guardar los cambios pendientes de las otras pestañas.' : '';
  if (!confirm(`¿Enviar este aviso a todos los celulares que tienen la app?\n\n${p.titulo}\n${p.texto}\n\nNo se puede deshacer.${extra}`)) return;
  boton.disabled = true;
  estado.className = 'ayuda'; estado.textContent = 'Conectando con Firebase...';
  const azar = crypto.getRandomValues(new Uint8Array(6));
  const id = Date.now().toString(36) + '-' + Array.from(azar, (b) => b.toString(16).padStart(2, '0')).join('');
  const data = { accion: p.accion, link: p.link, id };
  const enviados = [], fallas = [];
  try {
    const acceso = await pedirAcceso(secretos.firebase);
    estado.textContent = 'Enviando...';
    for (const [topic, idioma, titulo, texto] of [['todos_es', 'español', p.titulo, p.texto], ['todos_en', 'inglés', p.titulo_en, p.texto_en]]) {
      try { await mandarPush(acceso, secretos.firebase.project_id, topic, titulo, texto, data); enviados.push(idioma); }
      catch (e) { fallas.push(idioma + ': ' + e.message); }
    }
  } catch (e) { fallas.push(e.message); }
  if (!enviados.length) { boton.disabled = false; return error('No se envió. ' + fallas.join(' · ')); }
  datos.push_historial.unshift({ id, fecha: new Date().toISOString(), ...p });
  datos.push_historial = datos.push_historial.slice(0, 30);
  cambio();
  estado.textContent = 'Guardando en Avisos...';
  const guardado = await guardar();
  let texto = fallas.length ? `Se envió solo a los celulares en ${enviados.join(' y ')}. Falló: ${fallas.join(' · ')}. Si lo mandás de nuevo, a los celulares en ${enviados.join(' y ')} les llega dos veces.` : 'Enviado a todos los celulares (en español y en inglés).';
  texto += guardado ? ' En unos minutos aparece también en Avisos de la app.' : ' Pero no se pudo guardar en Avisos: tocá "Guardar cambios".';
  if (!fallas.length) { push = pushVacio(); pushManual = { titulo: false, texto: false }; }
  pushResultado = { ok: !fallas.length && guardado, texto };
  if (tab === 'push') pintar();
}

async function mandarPush(acceso, proyecto, topic, titulo, texto, data) {
  const r = await fetch(`https://fcm.googleapis.com/v1/projects/${encodeURIComponent(proyecto)}/messages:send`, {
    method: 'POST',
    cache: 'no-store',
    headers: { Authorization: 'Bearer ' + acceso, 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: { topic, notification: { title: titulo, body: texto }, data, android: { priority: 'HIGH', notification: { channel_id: 'avisos' } }, apns: { payload: { aps: { sound: 'default' } } } } }),
  });
  if (r.ok) return;
  const j = await r.json().catch(() => ({}));
  const motivo = (j.error && j.error.message) || 'error ' + r.status;
  if (r.status === 403) throw new Error('Google no dejó enviar (' + motivo + '). Revisá que la API "Firebase Cloud Messaging API" esté activada en el proyecto.');
  throw new Error(motivo);
}

// Firma un JWT con la cuenta de servicio y lo canjea por un permiso de 1 hora para mandar push.
async function pedirAcceso(cuenta) {
  if (accesoFcm && accesoFcm.email === cuenta.client_email && accesoFcm.vence > Date.now() + 120000) return accesoFcm.valor;
  const ahora = Math.floor(Date.now() / 1000);
  const parte = (o) => b64url(new TextEncoder().encode(JSON.stringify(o)));
  const sinFirmar = parte({ alg: 'RS256', typ: 'JWT' }) + '.' + parte({ iss: cuenta.client_email, scope: 'https://www.googleapis.com/auth/firebase.messaging', aud: 'https://oauth2.googleapis.com/token', iat: ahora, exp: ahora + 3600 });
  let privada;
  try { privada = await crypto.subtle.importKey('pkcs8', pemABytes(cuenta.private_key), { name: 'RSASSA-PKCS1-v1_5', hash: 'SHA-256' }, false, ['sign']); }
  catch (e) { throw new Error('No se pudo leer la clave privada de Firebase. Generá una nueva en Firebase y conectala otra vez.'); }
  const firma = new Uint8Array(await crypto.subtle.sign('RSASSA-PKCS1-v1_5', privada, new TextEncoder().encode(sinFirmar)));
  const r = await fetch('https://oauth2.googleapis.com/token', {
    method: 'POST',
    cache: 'no-store',
    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: new URLSearchParams({ grant_type: 'urn:ietf:params:oauth:grant-type:jwt-bearer', assertion: sinFirmar + '.' + b64url(firma) }),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.access_token) {
    const motivo = j.error_description || j.error || r.status;
    throw new Error('Google no aceptó la cuenta de Firebase (' + motivo + ').' + (j.error === 'invalid_grant' ? ' Revisá que la fecha y hora de la compu estén bien, o que la clave no se haya borrado en Firebase.' : ''));
  }
  accesoFcm = { valor: j.access_token, vence: Date.now() + (j.expires_in || 3600) * 1000, email: cuenta.client_email };
  return j.access_token;
}

async function leerCuentaServicio(archivo) {
  if (!archivo) throw new Error('Elegí el archivo .json que bajaste de Firebase.');
  if (archivo.size > 20000) throw new Error('Ese archivo es muy grande para ser la clave de Firebase.');
  let j;
  try { j = JSON.parse(await archivo.text()); } catch (e) { throw new Error('Ese archivo no es un .json válido.'); }
  if (!j || j.type !== 'service_account') throw new Error('Ese archivo no es una cuenta de servicio de Firebase.');
  if (typeof j.project_id !== 'string' || !/^[a-z0-9-]{4,40}$/.test(j.project_id)) throw new Error('Al archivo le falta project_id.');
  if (typeof j.client_email !== 'string' || !/^[^@\s]+@[^@\s]+\.iam\.gserviceaccount\.com$/.test(j.client_email)) throw new Error('Al archivo le falta client_email.');
  if (typeof j.private_key !== 'string' || !j.private_key.includes('BEGIN PRIVATE KEY')) throw new Error('Al archivo le falta private_key.');
  return j;
}

// ---------- Cifrado ----------
// clave.json (público) guarda {v:2, iter, sal, iv, datos}: AES-GCM-256 con clave PBKDF2-SHA256 de la contraseña.
// Adentro va {github, firebase}. El formato viejo (sin "v", 310000 vueltas, solo el token) se acepta y se migra.
const ITER = 600000, ITER_VIEJO = 310000;
const b64 = (u8) => { let x = ''; for (let i = 0; i < u8.length; i += 0x8000) x += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(x); };
const deb64 = (t) => Uint8Array.from(atob(t), (c) => c.charCodeAt(0));
const b64url = (u8) => b64(u8).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const pemABytes = (pem) => deb64(String(pem).replace(/-----[A-Z ]+-----/g, '').replace(/\\n/g, '').replace(/\s+/g, ''));
const a64 = (s) => b64(new TextEncoder().encode(s));
const de64 = (s) => new TextDecoder().decode(deb64(s.replace(/\n/g, '')));

async function llave(pass, sal, iter = ITER) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: sal, iterations: iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function cifrar(texto, pass) {
  const sal = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const c = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await llave(pass, sal, ITER), new TextEncoder().encode(texto));
  return { v: 2, iter: ITER, sal: b64(sal), iv: b64(iv), datos: b64(new Uint8Array(c)) };
}
async function descifrar(j, pass) {
  const iter = j.v === 2 ? j.iter : ITER_VIEJO;
  const c = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: deb64(j.iv) }, await llave(pass, deb64(j.sal), iter), deb64(j.datos));
  return new TextDecoder().decode(c);
}
async function abrirSecretos(j, pass) {
  const texto = await descifrar(j, pass);
  if (j.v !== 2) return { secretos: { github: texto.trim(), firebase: null }, viejo: true };
  const s = JSON.parse(texto);
  if (!s || typeof s.github !== 'string') throw new Error('formato');
  return { secretos: { github: s.github, firebase: s.firebase && typeof s.firebase === 'object' ? s.firebase : null }, viejo: false };
}
async function leerClaveCifrada() {
  const r = await api('contents/clave.json', {}, null);
  if (r.status === 404) return null;
  if (r.status === 403 || r.status === 429) throw new Error('GitHub está frenando las consultas. Esperá unos minutos y probá de nuevo.');
  if (!r.ok) throw new Error('No pude leer la configuración (' + r.status + ').');
  const j = await r.json();
  let c = null;
  try { c = JSON.parse(de64(j.content)); } catch (e) {}
  const valido = c && typeof c.sal === 'string' && typeof c.iv === 'string' && typeof c.datos === 'string' &&
    (c.v === undefined || (c.v === 2 && Number.isInteger(c.iter) && c.iter >= 100000 && c.iter <= 5000000));
  if (!valido) throw new Error('La configuración guardada está dañada.');
  return { ...c, sha: j.sha };
}
async function escribirClave(nuevos, pass, shaClave) {
  const cuerpo = { message: 'Panel: configuración de acceso', content: a64(JSON.stringify(await cifrar(JSON.stringify(nuevos), pass))) };
  if (shaClave) cuerpo.sha = shaClave;
  const r = await api('contents/clave.json', { method: 'PUT', body: JSON.stringify(cuerpo) }, nuevos.github);
  if (r.status === 401 || r.status === 403 || r.status === 404) throw new Error('La clave de GitHub no tiene permiso para guardar. Revisá que tenga Contents: Read and write.');
  if (r.status === 409 || r.status === 422) throw new Error('La configuración cambió mientras tanto. Recargá la página y probá de nuevo.');
  if (!r.ok) throw new Error('No pude guardar la configuración (' + r.status + ').');
}

// ---------- Datos ----------
async function cargar() {
  const r = await api(`contents/${ARCHIVO}`);
  if (r.status === 401) { const e = new Error('La clave de GitHub dejó de funcionar.'); e.vencida = true; throw e; }
  if (r.status === 403) throw new Error('La clave no tiene permiso. Revisá que tenga Contents: Read and write.');
  if (!r.ok) throw new Error('No encontré el archivo de datos (' + r.status + ').');
  const j = await r.json();
  sha = j.sha;
  datos = JSON.parse(de64(j.content));
  datos.config = datos.config || {}; datos.en = datos.en || {}; datos.noticias = datos.noticias || []; datos.iglesias = datos.iglesias || []; datos.misioneros = datos.misioneros || [];
  datos.push_historial = Array.isArray(datos.push_historial) ? datos.push_historial.filter((h) => h && typeof h === 'object') : [];
}

// Revisa lo que se va a guardar: links https, ids de YouTube y largos.
function revisar() {
  const cfg = datos.config;
  for (const [k, nombre] of [['envivo_url', 'El link de la transmisión'], ['actualizar_url', 'El link de Android'], ['actualizar_url_ios', 'El link de iPhone']]) {
    if (typeof cfg[k] === 'string') cfg[k] = cfg[k].trim();
    if (cfg[k] && !esHttps(cfg[k])) return nombre + ' tiene que empezar con https://';
  }
  if (cfg.version_app && !/^\d+(\.\d+){0,3}$/.test(String(cfg.version_app).trim())) return 'La versión tiene que ser solo números y puntos (ej: 1.0.1).';
  for (const n of datos.noticias) {
    if (n.video && !/^[\w-]{11}$/.test(n.video)) return 'Hay una novedad con un link de YouTube que no reconozco.';
    if (String(n.titulo || '').length > 150 || String(n.texto || '').length > 1500) return 'Hay una novedad con un texto demasiado largo.';
  }
  const fotoOk = (f) => !f || esHttps(f) || NOMBRE_FOTO_APP.test(f);
  for (const c of datos.iglesias) {
    if (!(c.fotos || []).every(fotoOk)) return `La iglesia ${c.ciudad || c.nombre} tiene una foto con un link que no empieza con https://`;
    if (!Number.isFinite(+c.lat) || !Number.isFinite(+c.lng)) return `La iglesia ${c.ciudad || c.nombre} no tiene bien la ubicación.`;
  }
  // Avisos enviados: la app los lee tal cual, así que tienen que respetar el formato acordado.
  const textosAviso = ['id', 'fecha', 'titulo', 'texto', 'titulo_en', 'texto_en', 'accion', 'link'];
  for (const h of datos.push_historial) {
    const bien = textosAviso.every((k) => typeof h[k] === 'string') && ACCIONES_PUSH.some(([a]) => a === h.accion) && (h.accion === 'link' ? esHttps(h.link) : h.link === '');
    if (!bien) return `El aviso enviado "${String(h.titulo || '').slice(0, 40)}" tiene datos que la app no puede usar (por ejemplo, un link sin https://). Quitalo en la pestaña Notificaciones push.`;
  }
  return '';
}

let guardando = false;
async function guardar() {
  // Si ya se está guardando (por ejemplo, al mandar un push justo después de "Guardar cambios"), espera y guarda de nuevo.
  while (guardando) await new Promise((ok) => setTimeout(ok, 200));
  if (!datos) return false;
  const problema = revisar();
  if (problema) { $('#estado').textContent = problema; $('#estado').className = 'estado error'; return false; }
  guardando = true;
  $('#guardar').disabled = true;
  $('#estado').className = 'estado';
  try {
    $('#estado').textContent = 'Traduciendo al inglés...';
    await completarIngles();
    $('#estado').textContent = 'Guardando...';
    datos.actualizado = new Date().toISOString().slice(0, 10);
    const guardada = version;
    const r = await api(`contents/${ARCHIVO}`, {
      method: 'PUT',
      body: JSON.stringify({ message: 'Panel: cambios del ' + new Date().toLocaleString('es-UY'), content: a64(JSON.stringify(datos, null, 1)), sha }),
    });
    if (r.status === 409) throw new Error('Alguien guardó cambios antes. Recargá la página.');
    if (r.status === 401) throw new Error('La clave de GitHub dejó de funcionar. Reemplazala en la pestaña Seguridad y volvé a guardar.');
    if (r.status === 403 || r.status === 404) throw new Error('La clave de GitHub no tiene permiso para guardar. Revisá que tenga Contents: Read and write.');
    if (!r.ok) throw new Error('No se pudo guardar (' + r.status + ').');
    sha = (await r.json()).content.sha;
    // Lo que se escribió mientras se guardaba no entró en este guardado: queda pendiente.
    if (version !== guardada) { $('#guardar').disabled = false; $('#estado').textContent = 'Guardado, pero hay cambios nuevos sin guardar.'; $('#estado').className = 'estado'; return true; }
    sucio = false;
    $('#estado').textContent = 'Guardado. La app lo muestra en unos minutos.'; $('#estado').className = 'estado ok';
    return true;
  } catch (e) {
    $('#estado').textContent = e.message; $('#estado').className = 'estado error';
    $('#guardar').disabled = false;
    return false;
  } finally { guardando = false; }
}

// ---------- Sesión: bloqueo por intentos y cierre por inactividad ----------
const CLAVE_INTENTOS = 'carpa_panel_intentos';
let intentosMem = { fallos: 0, hasta: 0 }, relojBloqueo = null;
const TOPE_ESPERA = 15 * 60000;
function leerIntentos() {
  try {
    const j = JSON.parse(localStorage.getItem(CLAVE_INTENTOS) || 'null');
    if (j) {
      // Si la hora de la compu se atrasó (o alguien tocó el dato), la espera nunca pasa de 15 minutos.
      const n = { fallos: +j.fallos || 0, hasta: +j.hasta || 0 }, tope = Date.now() + TOPE_ESPERA;
      if (n.hasta > tope) { n.hasta = tope; localStorage.setItem(CLAVE_INTENTOS, JSON.stringify(n)); }
      return n;
    }
  } catch (e) {}
  return intentosMem;
}
function anotarFallo() {
  const n = { ...leerIntentos() };
  n.fallos++;
  if (n.fallos >= 5) n.hasta = Date.now() + Math.min(30000 * 2 ** (n.fallos - 5), TOPE_ESPERA);
  intentosMem = n;
  try { localStorage.setItem(CLAVE_INTENTOS, JSON.stringify(n)); } catch (e) {}
}
function limpiarFallos() { intentosMem = { fallos: 0, hasta: 0 }; try { localStorage.removeItem(CLAVE_INTENTOS); } catch (e) {} }
const espera = () => Math.max(0, leerIntentos().hasta - Date.now());
const mmss = (ms) => { const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

function mostrarBloqueo(antes = '') {
  const est = $('#loginEstado'), boton = $('#entrar');
  clearInterval(relojBloqueo);
  const paso = () => {
    const ms = espera();
    if (!ms) { clearInterval(relojBloqueo); boton.disabled = false; est.textContent = 'Ya podés volver a probar.'; est.className = 'ayuda'; return; }
    boton.disabled = true;
    est.textContent = antes + 'Por seguridad, esperá ' + mmss(ms) + ' para volver a probar.'; est.className = 'ayuda error';
  };
  paso();
  relojBloqueo = setInterval(paso, 1000);
}

const INACTIVIDAD = 20 * 60000, AVISO_ANTES = 2 * 60000;
let ultimaActividad = Date.now(), relojSesion = null;
function actividad() {
  if (!secretos) return;
  if (Date.now() - ultimaActividad >= INACTIVIDAD) { cerrarSesion(); return; }
  ultimaActividad = Date.now();
  $('#avisoSesion').classList.add('oculto');
}
function vigilarSesion() {
  ultimaActividad = Date.now();
  clearInterval(relojSesion);
  relojSesion = setInterval(() => {
    if (!secretos) return;
    const resto = INACTIVIDAD - (Date.now() - ultimaActividad), aviso = $('#avisoSesion');
    if (resto <= 0) { cerrarSesion(); return; }
    if (resto > AVISO_ANTES) return;
    aviso.textContent = `Por seguridad, el panel se cierra en ${mmss(resto)} por falta de actividad.` + (sucio ? ' Tenés cambios sin guardar: guardalos o tocá cualquier lado para seguir.' : ' Tocá cualquier lado para seguir.');
    aviso.classList.remove('oculto');
  }, 1000);
}
function cerrarSesion() {
  if (sucio && datos) pendiente = { datos, sha };
  secretos = null; accesoFcm = null; datos = null; sha = null; sucio = false; formatoViejo = false;
  clearInterval(relojSesion);
  $('#avisoSesion').classList.add('oculto'); $('#modal').style.display = 'none'; alListo = null;
  $('#panel').classList.add('oculto'); $('#barra').classList.add('oculto'); $('#salir').classList.add('oculto');
  $('#vista').replaceChildren();
  $('#guardar').disabled = true; $('#estado').textContent = 'Sin cambios'; $('#estado').className = 'estado';
  cancelarPrimera();
  $('#pass').value = '';
  $('#login').classList.remove('oculto');
  $('#loginEstado').textContent = 'Se cerró la sesión después de 20 minutos sin actividad.' + (pendiente ? ' Tus cambios sin guardar siguen en esta pestaña: entrá de nuevo y guardalos.' : '');
  $('#loginEstado').className = 'ayuda';
}

async function abrirPanel() {
  await cargar();
  let recuperado = false;
  if (pendiente) { if (pendiente.sha === sha) { datos = pendiente.datos; recuperado = true; } pendiente = null; }
  cancelarPrimera();
  $('#pass').value = '';
  $('#login').classList.add('oculto');
  $('#panel').classList.remove('oculto'); $('#barra').classList.remove('oculto'); $('#salir').classList.remove('oculto');
  $('#loginEstado').textContent = '';
  vigilarSesion();
  pintarTabs(); pintar();
  if (recuperado) { cambio(); $('#estado').textContent = 'Recuperamos tus cambios sin guardar. Tocá "Guardar cambios".'; }
}

// ---------- Entrar ----------
let modoPrimera = 'nueva', guardadosVencida = null, entrando = false, guardandoPrimera = false, passCorta = false;

async function entrar() {
  const est = $('#loginEstado'), boton = $('#entrar');
  // Con Enter se puede llamar varias veces seguidas: un solo intento por vez, así el bloqueo no se saltea.
  if (entrando) return;
  if (espera()) { mostrarBloqueo(); return; }
  const pass = $('#pass').value;
  if (!pass) { est.textContent = 'Escribí la contraseña.'; est.className = 'ayuda error'; return; }
  entrando = true;
  boton.disabled = true; est.textContent = 'Entrando...'; est.className = 'ayuda';
  try {
    const cifrada = await leerClaveCifrada();
    if (!cifrada) { est.textContent = ''; mostrarPrimeraVez('nueva'); return; }
    let abierto;
    try { abierto = await abrirSecretos(cifrada, pass); } catch (e) {
      anotarFallo();
      if (espera()) { mostrarBloqueo('Contraseña incorrecta. '); return; }
      throw new Error('Contraseña incorrecta.');
    }
    limpiarFallos();
    secretos = abierto.secretos; formatoViejo = abierto.viejo; passCorta = pass.length < 10;
    try { await abrirPanel(); } catch (e) {
      secretos = null;
      if (!e.vencida) throw e;
      guardadosVencida = abierto.secretos;
      est.textContent = '';
      mostrarPrimeraVez('vencida');
    }
  } catch (e) {
    secretos = null;
    est.textContent = e.message; est.className = 'ayuda error';
  } finally { entrando = false; if (!espera()) boton.disabled = false; }
}

function mostrarPrimeraVez(modo) {
  modoPrimera = modo;
  $('#primeraTitulo').textContent = modo === 'nueva' ? 'Configurar el panel (una sola vez)' : 'La clave de GitHub dejó de funcionar';
  $('#primeraAyuda').textContent = modo === 'nueva'
    ? 'Todavía no hay nada configurado. El panel guarda los cambios en GitHub con una clave que solo puede tocar este repositorio. La pegás acá una vez y queda guardada cifrada con la contraseña que escribiste arriba. Después se entra solo con la contraseña.'
    : 'La contraseña está bien, pero la clave de GitHub venció o la borraron. Creá una nueva y pegala acá: se guarda cifrada con la misma contraseña.';
  $('#pasosToken').replaceChildren(pasosToken());
  $('#cajaPass2').classList.toggle('oculto', modo !== 'nueva');
  $('#pass').readOnly = modo === 'vencida';
  $('#entrar').classList.add('oculto');
  $('#primeraVez').classList.remove('oculto');
  $('#token').focus();
}

function cancelarPrimera() {
  guardadosVencida = null;
  $('#primeraVez').classList.add('oculto'); $('#entrar').classList.remove('oculto');
  $('#pass').readOnly = false;
  $('#token').value = ''; $('#pass2').value = ''; $('#primeraEstado').textContent = '';
}

async function guardarPrimera() {
  if (guardandoPrimera) return;
  const est = $('#primeraEstado'), boton = $('#guardarPrimera'), token = $('#token').value.trim(), pass = $('#pass').value;
  est.className = 'ayuda';
  guardandoPrimera = true;
  boton.disabled = true;
  try {
    if (modoPrimera === 'nueva') {
      if (pass.length < 10) throw new Error('La contraseña tiene que tener al menos 10 caracteres. Cambiala arriba.');
      if ($('#pass2').value !== pass) throw new Error('Las dos contraseñas no coinciden.');
    } else if (!guardadosVencida) throw new Error('Volvé a escribir la contraseña y tocá Entrar.');
    validarToken(token);
    est.textContent = 'Probando la clave...';
    await probarToken(token);
    const vieja = await leerClaveCifrada();
    if (modoPrimera === 'nueva' && vieja) throw new Error('Ya hay una configuración guardada. Recargá la página y entrá con tu contraseña.');
    const nuevos = { github: token, firebase: modoPrimera === 'vencida' ? guardadosVencida.firebase : null };
    est.textContent = 'Guardando cifrado...';
    await escribirClave(nuevos, pass, vieja && vieja.sha);
    secretos = nuevos; formatoViejo = false; passCorta = pass.length < 10;
    est.textContent = '';
    await abrirPanel();
  } catch (e) {
    if (!$('#panel').classList.contains('oculto')) return;
    secretos = null;
    est.textContent = e.message; est.className = 'ayuda error';
  } finally { guardandoPrimera = false; boton.disabled = false; }
}

function salir() {
  if (sucio && !confirm('Hay cambios sin guardar. ¿Salir igual?')) return;
  secretos = null; accesoFcm = null; guardadosVencida = null; datos = null; sucio = false; pendiente = null;
  try { sessionStorage.removeItem('clave'); } catch (e) {}
  location.reload();
}

(function inicio() {
  // Versiones anteriores del panel guardaban la clave en el navegador: se borra.
  try { sessionStorage.removeItem('clave'); localStorage.removeItem('clave'); } catch (e) {}
  // GitHub Pages no deja prohibir que otra página meta el panel adentro (iframe) para engañar los clics: en ese caso no arranca.
  let enMarco = true;
  try { enMarco = window.top !== window.self; } catch (e) {}
  if (enMarco) {
    $('#login').replaceChildren(el('h2', { text: 'Abrí el panel directamente' }), el('p', { class: 'ayuda', text: 'Por seguridad, el panel no funciona dentro de otra página. Entrá escribiendo la dirección en el navegador.' }));
    return;
  }
  const enter = (fn) => (e) => { if (e.key === 'Enter') fn(); };
  $('#entrar').addEventListener('click', entrar);
  $('#pass').addEventListener('keydown', enter(() => ($('#primeraVez').classList.contains('oculto') ? entrar() : guardarPrimera())));
  $('#token').addEventListener('keydown', enter(guardarPrimera));
  $('#pass2').addEventListener('keydown', enter(guardarPrimera));
  $('#guardarPrimera').addEventListener('click', guardarPrimera);
  $('#cancelarPrimera').addEventListener('click', cancelarPrimera);
  $('#guardar').addEventListener('click', guardar);
  $('#salir').addEventListener('click', salir);
  ['pointerdown', 'keydown', 'mousemove', 'wheel', 'touchstart', 'scroll'].forEach((ev) => window.addEventListener(ev, actividad, { passive: true, capture: true }));
  window.addEventListener('beforeunload', (e) => { if (sucio || pendiente) { e.preventDefault(); e.returnValue = ''; } });
  if (espera()) mostrarBloqueo();
  $('#pass').focus();
})();
</script>
